<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinator Vitals — BMI a sledování váhy</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0F0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vitals">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  :root{
    --bg:#0A0F0D; --bg-2:#0E1512; --surface:#131B18; --surface-2:#1B2521; --ink:#EDF5F1; --ink-muted:#8CA69C; --line:#243029;
    --accent:#3EE29A; --accent-2:#28B4E0; --accent-soft:rgba(62,226,154,0.14);
    --under:#5AA6E8; --under-soft:rgba(90,166,232,0.14);
    --normal:#3EE29A; --normal-soft:rgba(62,226,154,0.14);
    --over:#F0B84A; --over-soft:rgba(240,184,74,0.14);
    --obese:#F0725E; --obese-soft:rgba(240,114,94,0.14);
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 12% 0%, rgba(62,226,154,0.08) 0%, transparent 45%),
      radial-gradient(circle at 90% 8%, rgba(40,180,224,0.07) 0%, transparent 40%),
      radial-gradient(circle at 1px 1px, rgba(237,245,241,0.035) 1px, transparent 0);
    background-size: auto, auto, 22px 22px;
    min-height:100vh; font-family:'Inter',sans-serif; color:var(--ink);
    padding:24px 16px 60px;
  }
  .page,.onboard{max-width:560px;margin:0 auto;}
  .eyebrow{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--accent);font-weight:500;}
  .header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
  .hello{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin:2px 0 0;}
  .card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);}
  .card-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;margin-bottom:14px;}
  .gauge-card{text-align:center;}
  .gauge-wrap{position:relative;max-width:300px;margin:0 auto;}
  .gauge-svg{width:100%;height:auto;display:block;}
  .gauge-readout{position:absolute;left:0;right:0;bottom:10px;text-align:center;}
  .bmi-number{font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
  .bmi-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--ink-muted);margin-top:2px;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;font-size:13px;font-weight:600;margin:8px 0 14px;}
  .pill-dot{width:7px;height:7px;border-radius:50%;}
  .about-me-link{display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 8px;border-radius:100px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-muted);font-size:12px;font-weight:600;margin-top:6px;cursor:pointer;}
  .about-me-link svg:first-child{color:var(--accent);flex-shrink:0;}
  .about-me-link .about-me-chevron{margin-left:2px;opacity:.6;}
  .dash-top-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .dash-logo{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--ink-muted);letter-spacing:.02em;}
  .dash-logo svg{color:var(--accent);flex-shrink:0;}
  .dash-top-actions{display:flex;align-items:center;gap:8px;}
  .dash-welcome{margin-bottom:16px;}
  .dash-welcome-title{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin:0 0 4px;}
  .dash-welcome-subtitle{color:var(--ink-muted);font-size:12px;font-family:'JetBrains Mono',monospace;letter-spacing:.02em;}
  .dash-highlight{color:var(--accent);}
  .dash-stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
  .dash-stat-card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;cursor:pointer;font-family:inherit;color:inherit;box-shadow:var(--shadow);transition:transform .12s;-webkit-tap-highlight-color:transparent;}
  .dash-stat-card:active{transform:scale(.97);}
  .dash-stat-card .card-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .dash-stat-card .card-icon{display:inline-flex;align-items:center;justify-content:center;}
  .dash-bmi-value{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
  .dash-bmi-sub{font-size:11px;color:var(--ink-muted);margin-top:5px;}
  .dash-weight-value{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
  .dash-weight-trend{font-size:11px;margin-top:8px;font-weight:600;}
  .dash-actions{display:flex;gap:10px;margin-bottom:18px;}
  .dash-actions .btn-primary,.dash-actions .btn-secondary{flex:1;}
  .quick-add-hint{display:flex;align-items:flex-start;gap:8px;background:var(--accent-soft);border:1px solid rgba(62,226,154,0.25);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.4;color:var(--ink);margin-bottom:12px;}
  .quick-add-hint svg{flex-shrink:0;color:var(--accent);margin-top:1px;}
  .water-track{width:100%;height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-bottom:12px;}
  .water-track-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#3B82F6,#5AA6E8);transition:width .3s;}
  .water-actions{display:flex;gap:10px;align-items:center;}
  .water-actions .btn-secondary{color:#3B82F6;border-color:rgba(59,130,246,0.3);background:rgba(59,130,246,0.1);}
  .fav-star-btn{background:transparent;border:none;padding:2px;cursor:pointer;color:var(--ink-muted);display:inline-flex;align-items:center;flex-shrink:0;}
  .fav-star-btn.active{color:#F0B84A;}
  .tpl-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
  .tpl-card-info{flex:1;min-width:0;}
  .tpl-card-name{font-weight:600;font-size:13.5px;}
  .tpl-card-meta{font-size:11px;color:var(--ink-muted);margin-top:2px;}
  @media (max-width:360px){
    .dash-stats-grid{grid-template-columns:1fr;}
  }
  .advice{font-size:14px;line-height:1.55;text-align:left;margin:0 0 10px;}
  .advice-note{font-size:13px;line-height:1.5;color:var(--ink-muted);text-align:left;margin:0;}
  .advice-note strong{color:var(--ink);}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .stat-card{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px 12px;}
  .stat-label{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);margin-bottom:6px;}
  .stat-value{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px;}
  .stat-value span{font-size:12px;font-weight:500;color:var(--ink-muted);}
  .stat-sub{font-size:11px;color:var(--ink-muted);margin-top:4px;}
  .entry-form{display:flex;gap:10px;align-items:end;flex-wrap:wrap;}
  .entry-form .field{flex:1;min-width:120px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .field-desc-wrap{position:relative;}
  .desc-suggestions{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35);max-height:260px;overflow-y:auto;}
  .desc-suggestion-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);}
  .desc-suggestion-item:last-child{border-bottom:none;}
  .desc-suggestion-item:hover,.desc-suggestion-item:active{background:var(--bg-2);}
  .desc-suggestion-name{font-size:13px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .desc-suggestion-meta{font-size:11px;color:var(--ink-muted);flex-shrink:0;}
  .desc-suggestion-tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-muted);flex-shrink:0;padding:2px 6px;border:1px solid var(--line);border-radius:6px;}
  .desc-suggestion-loading{padding:10px 12px;font-size:12px;color:var(--ink-muted);}
  .alc-preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
  .alc-preset-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .alc-preset-name{font-size:12.5px;font-weight:600;}
  .alc-preset-meta{font-size:10.5px;color:var(--ink-muted);}
  .alc-preset-add{width:100%;background:var(--accent-soft,rgba(62,226,154,0.14));color:var(--accent);border:none;border-radius:9px;padding:6px 0;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;}
  .alc-preset-add:active{opacity:.75;}
  .alc-added-toast{font-size:12px;color:var(--accent);text-align:center;padding:6px 0;}
  .field span{font-size:12px;font-weight:600;color:var(--ink-muted);}
  .field-row{display:flex;gap:10px;flex-wrap:wrap;}
  .field-row .field{flex:1;}
  .input{border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);background:var(--bg-2);outline:none;transition:border-color .15s,background .15s;width:100%;}
  .input:focus{border-color:var(--accent);background:var(--surface-2);}
  select.input{appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%238CA69C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>');background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;}
  .seg{display:flex;gap:8px;}
  .seg-btn{flex:1;border:1px solid var(--line);background:var(--bg-2);color:var(--ink-muted);border-radius:12px;padding:10px 8px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;text-align:center;}
  .seg-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06231A;border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s;white-space:nowrap;}
  .btn-primary:hover{opacity:.92;}
  .btn-primary:active{transform:scale(.97);}
  .btn-icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;transition:background .15s;}
  .btn-icon:hover{background:var(--accent-soft);}
  .btn-icon.subtle{border:none;background:transparent;color:var(--ink-muted);}
  .btn-icon.subtle:hover{background:var(--obese-soft);color:var(--obese);}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-ghost-danger{background:none;border:1px solid var(--obese);color:var(--obese);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-ghost-danger:hover{background:var(--obese-soft);}
  .form-error{display:flex;align-items:center;gap:6px;color:var(--obese);font-size:12.5px;margin:4px 0 10px;}
  .error-banner{display:flex;align-items:center;gap:8px;background:var(--obese-soft);color:var(--obese);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px;}
  .chart-wrap{margin-top:-6px;}
  .chart-legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted);margin-top:4px;}
  .legend-swatch{width:12px;height:12px;border-radius:4px;display:inline-block;background:var(--accent-soft);}
  .empty-state{font-size:13px;color:var(--ink-muted);padding:20px 0;text-align:center;}
  .history-list{display:flex;flex-direction:column;gap:2px;max-height:320px;overflow-y:auto;}
  .history-item{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);}
  .history-item:last-child{border-bottom:none;}
  .history-weight{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;}
  .history-date{font-size:12px;color:var(--ink-muted);margin-top:1px;}
  .footer-note{font-size:12px;color:var(--ink-muted);text-align:center;margin-top:22px;line-height:1.5;}
  .onboard{padding-top:40px;}
  .onboard-title{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;margin:6px 0 8px;line-height:1.1;}
  .onboard-title span{color:var(--accent);}
  .onboard-sub{color:var(--ink-muted);font-size:14px;margin-bottom:22px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(4,8,7,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;backdrop-filter:blur(3px);overflow-y:auto;}
  .modal{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:calc(100dvh - 40px);overflow-y:auto;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .danger-zone{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .confirm-row{display:flex;flex-direction:column;gap:8px;font-size:13px;}
  .confirm-row .row-btns{display:flex;gap:8px;}
  .fade-up{animation:fadeUp .5s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (max-width:420px){
    .stat-grid{grid-template-columns:1fr 1fr;}
    .stat-grid .stat-card:last-child{grid-column:span 2;}
    .bmi-number{font-size:32px;}
    .onboard-title{font-size:28px;}
  }

  .exercise-teaser{display:flex;align-items:center;gap:14px;}
  .exercise-teaser-icon{
    width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .exercise-teaser-text{flex:1;}
  .exercise-teaser-text .card-title{margin-bottom:2px;}
  .exercise-teaser-text p{font-size:13px;color:var(--ink-muted);margin:0;line-height:1.4;display:flex;align-items:center;}
  .bmi-teaser{display:flex;align-items:center;gap:14px;}
  .bmi-teaser-icon{
    width:44px;height:44px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;
  }
  .install-banner{display:flex;align-items:center;gap:14px;}
  .install-banner-icon{
    width:44px;height:44px;border-radius:12px;flex-shrink:0;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .install-banner-text{flex:1;min-width:0;}
  .install-banner-text p{font-size:12.5px;color:var(--ink-muted);margin:0;line-height:1.4;}
  .install-banner .btn-primary{white-space:nowrap;flex-shrink:0;padding:9px 14px;font-size:13px;}
  .btn-secondary{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
    background:var(--accent-soft);color:var(--accent);border:1px solid rgba(62,226,154,.25);border-radius:12px;
    padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:opacity .15s;
  }
  .btn-secondary:hover{opacity:.85;}
  .btn-secondary:disabled,.btn-primary:disabled{opacity:.6;cursor:not-allowed;}

  .modal-lg{max-width:460px;max-height:85vh;display:flex;flex-direction:column;padding:0;overflow:hidden;}
  .modal-lg .modal-header{padding:20px 20px 14px;margin-bottom:0;border-bottom:1px solid var(--line);}
  .modal-lg-body{padding:16px 20px 22px;overflow-y:auto;}

  .tab-row{display:flex;gap:8px;padding:14px 20px 0;}
  .tab-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--bg-2);border:1px solid var(--line);color:var(--ink-muted);
    border-radius:12px;padding:10px 8px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;transition:background .15s,color .15s,border-color .15s;
  }
  .tab-btn.active{background:var(--accent);border-color:var(--accent);color:#06231A;}

  .exercise-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .exercise-item{border:1px solid var(--line);border-radius:14px;padding:13px 14px;}
  .exercise-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
  .exercise-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;}
  .exercise-badges{display:flex;gap:5px;flex-shrink:0;}
  .eq-badge{
    display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;
    padding:3px 8px;border-radius:100px;font-family:'JetBrains Mono',monospace;white-space:nowrap;
  }
  .eq-badge.bodyweight{background:var(--normal-soft);color:var(--normal);}
  .eq-badge.dumbbell{background:var(--under-soft);color:var(--under);}
  .exercise-meta{font-size:12px;color:var(--ink-muted);margin-bottom:5px;font-family:'JetBrains Mono',monospace;}
  .exercise-tip{font-size:13px;line-height:1.5;color:var(--ink);margin:0;}
  .exercise-group-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-family:'JetBrains Mono',monospace;margin:16px 0 2px;}
  .exercise-group-label:first-child{margin-top:0;}

  .exercise-item{cursor:pointer;transition:border-color .15s,background .15s;}
  .exercise-item:hover, .exercise-item:focus{border-color:var(--accent);background:var(--accent-soft);outline:none;}
  .exercise-open-hint{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--accent);font-weight:600;margin-top:8px;}

  .modal-header{position:relative;display:flex;align-items:center;}
  .figure-card{
    background:var(--bg);border:1px solid var(--line);border-radius:16px;
    max-width:220px;margin:0 auto 14px;padding:10px;
  }
  .figure-svg{width:100%;height:auto;display:block;}
  .detail-section-label{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;margin:0 0 10px;}
  .steps-list{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px;}
  .steps-list li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.5;}
  .step-num{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;
    font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .tip-callout{
    background:var(--over-soft);color:var(--ink);border-radius:12px;padding:12px 14px;
    font-size:13px;line-height:1.5;margin-bottom:14px;
  }
  .tip-callout strong{color:var(--over);}
  .video-link{width:100%;text-decoration:none;box-sizing:border-box;}

  .cal-hero{text-align:center;}

function parseHM(str, fallbackH, fallbackM){
  var m = /^(\d{1,2}):(\d{2})$/.exec(str||'');
  if(!m) return {h:fallbackH, m:fallbackM};
  return {h:Number(m[1]), m:Number(m[2])};
}
function msUntil(hour, minute){
  var now = new Date();
  var target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, minute, 0, 0);
  if(target.getTime()<=now.getTime()) target.setDate(target.getDate()+1);
  return target.getTime()-now.getTime();
}
function scheduleDaily(hour, minute, fn, timerKey){
  if(notifTimers[timerKey]) clearTimeout(notifTimers[timerKey]);
  notifTimers[timerKey] = setTimeout(function(){

    scheduleDaily(hour, minute, fn, timerKey);
  }, msUntil(hour, minute));
}
function scheduleWaterReminder(){
  if(notifTimers.water) clearTimeout(notifTimers.water);
  var cfg = state.notifConfig;
  if(!cfg || !cfg.enabled || !cfg.waterEnabled) return;
  var now = new Date();
  var nowMin = now.getHours()*60+now.getMinutes();
  var startM = parseHM(cfg.waterStart,8,0), endM = parseHM(cfg.waterEnd,22,0);
  var startMin = startM.h*60+startM.m, endMin = endM.h*60+endM.m;
  var intervalMs = Math.max(1, cfg.waterIntervalHours||3)*3600000;
  var delayMs;
  if(endMin>startMin && (nowMin<startMin || nowMin>=endMin)){
    delayMs = (nowMin<startMin ? (startMin-nowMin) : (1440-nowMin+startMin))*60000;
  } else {
    delayMs = intervalMs;
  }
  notifTimers.water = setTimeout(function(){
    showLocalNotification('💧 Pitný režim', 'Nezapomeň se napít vody.', 'water-reminder');
    scheduleWaterReminder();
  }, delayMs);
}

  if(cfg.waterEnabled) scheduleWaterReminder();
  if(cfg.eveningEnabled){

  }
}

function fastingStatus(cfg){
  var totalEat = cfg.eatEnd - cfg.eatStart;
  if(totalEat<=0 || totalEat>=1440) return null;
  var totalFast = 1440 - totalEat;
  var now = new Date();
  var nowMin = now.getHours()*60 + now.getMinutes();
  var phase, elapsed, total;
  if(nowMin>=cfg.eatStart && nowMin<cfg.eatEnd){
    phase = 'eating';
    elapsed = nowMin - cfg.eatStart;
    total = totalEat;
  } else {
    phase = 'fasting';
    elapsed = nowMin<cfg.eatStart ? (1440-cfg.eatEnd)+nowMin : nowMin-cfg.eatEnd;
    total = totalFast;
  }
  var remaining = total - elapsed;
  var pct = total>0 ? Math.max(0, Math.min(100, elapsed/total*100)) : 0;
  return {phase:phase, elapsed:elapsed, total:total, remaining:remaining, pct:pct};
}

function calcDayTypePlan(plan, dayType){

    return {target:t2, proteinG:proteinG2, fatG:fatG2, carbG:carbG2};
  }

var ALCOHOL_ELIMINATION_PER_HOUR = 0.15; // ‰ za hodinu, průměrná hodnota
function alcoholWidmarkR(sex){ return sex==='female' ? 0.55 : 0.68; }
function computeAlcoholStatus(){
  var profile = state.profile;
  if(!profile) return {promile:0, drinksActive:false, soberAt:null, drinks:[]};
  var asc = sortedAsc(state.entries||[]);
  var weight = asc.length ? asc[asc.length-1].weight : null;
  if(!weight) return {promile:0, drinksActive:false, soberAt:null, drinks:[]};
  var r = alcoholWidmarkR(profile.sex);
  var now = Date.now();
  var total = 0;
  var anyEverContributed = false;
  var drinks = [];
  Object.keys(state.foodLog||{}).forEach(function(day){
    (state.foodLog[day]||[]).forEach(function(f){
      if(!f.alcohol || !f.time) return;
      var t0 = new Date(f.time).getTime();
      if(!isFinite(t0)) return;
      var hoursSince = (now - t0)/3600000;
      if(hoursSince < -0.05) return; // budoucí záznam, ignorovat
      if(hoursSince < 0) hoursSince = 0;
      var peak = f.alcohol / (r * weight);
      if(peak > 0) anyEverContributed = true;
      var current = peak - ALCOHOL_ELIMINATION_PER_HOUR*hoursSince;
      if(current > 0){
        total += current;
        drinks.push({id:f.id, name:f.name||'Nápoj', time:f.time, day:day, alcohol:f.alcohol, volumeMl:f.volumeMl, abv:f.abv, current:current, peak:peak});
      }
    });
  });
  drinks.sort(function(a,b){ return new Date(b.time)-new Date(a.time); });
  total = Math.round(total*100)/100;
  var soberAt = null;
  if(total > 0){
    var hoursLeft = total / ALCOHOL_ELIMINATION_PER_HOUR;
    soberAt = new Date(now + hoursLeft*3600000);
  }
  return {promile: total, drinksActive: total>0, soberAt: soberAt, everHadAlcohol: anyEverContributed, drinks: drinks};
}

function calcWeightGoalProgress(profile, startWeight, currentWeight, plan){

  var reached = Math.abs(diffToGo) < 0.1;
  var totalSpan = startWeight-targetWeight; // >0 if losing overall, <0 if gaining overall
  var pctRaw;
  if(Math.abs(totalSpan) < 0.05) pctRaw = 100;
  else pctRaw = ((startWeight-currentWeight)/totalSpan)*100;
  var pct = Math.max(0, Math.min(100, Math.round(pctRaw)));

  if(!reached && plan.weeklyDeltaKg!==0){
    var goingDown = plan.weeklyDeltaKg<0;
    var needsDown = diffToGo>0;

  if(!reached && !directionMismatch && plan.weeklyDeltaKg!==0){
    weeksLeft = Math.ceil(Math.abs(diffToGo/plan.weeklyDeltaKg));

function isRateLimitError(err){ return !!(err && err.message && /chyba 429/.test(err.message)); }
function friendlyAiError(err){
  var msg = (err && err.message) ? err.message : '';

function retryOn429(fn, retries, delayMs){
  return fn().catch(function(err){
    if(retries>0 && isRateLimitError(err)){
      return new Promise(function(res){ setTimeout(res, delayMs); }).then(function(){
        return retryOn429(fn, retries-1, delayMs*2);
      });
    }
    throw err;
  });
}
// České pivo se často značí "stupňovitostí" (°, stupně Plato/Balling — cukernatost mladiny),
// což NENÍ totéž co % objemu alkoholu. AI modely si to občas pletou (např. "pivo 10°" -> abv 10%,
// správně je to cca 3,5-4,2 %). Tahle funkce dá hrubý typický odhad % alkoholu ze stupňovitosti.
function typicalBeerAbvFromPlato(deg){
  var abv = (deg - 1.5) / 2.5;

  if(nameMatch) obj.name = nameMatch[1].replace(/\\"/g,'"');

    var m = raw.match(new RegExp('"'+key+'"\\s*:\\s*(-?[0-9]+(?:[.,][0-9]+)?)'));
    return m ? Number(m[1].replace(',','.')) : undefined;
  }
  obj.kcal = numField('kcal');
  obj.protein = numField('protein');
  obj.carbs = numField('carbs');
  obj.fat = numField('fat');
  obj.alcohol = numField('alcohol');
  obj.volumeMl = numField('volumeMl');
  obj.abv = numField('abv');
  if(obj.kcal===undefined) throw new Error('AI vrátila data v neočekávaném formátu, zkus to prosím znovu.');

// ---------- barcode reading (native BarcodeDetector + ZXing fallback + Open Food Facts lookup) ----------
function decodeBarcodeFromDataUrl(dataUrl){
  function tryNative(){
    if(!('BarcodeDetector' in window)) return Promise.reject(new Error('native-unsupported'));
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = function(){ reject(new Error('load-failed')); };
      img.src = dataUrl;
    }).then(function(img){
      var detector = new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','qr_code']});
      return detector.detect(img);
    }).then(function(results){
      if(!results || !results.length) throw new Error('not-found');
      return results[0].rawValue;
    });
  }
  function tryZxing(){
    if(!(window.ZXing && window.ZXing.BrowserMultiFormatReader)) return Promise.reject(new Error('Čtečka čárových kódů se nenačetla, zkontroluj připojení k internetu.'));
    var reader = new window.ZXing.BrowserMultiFormatReader();
    return reader.decodeFromImageUrl(dataUrl).then(function(result){ return result.getText(); });
  }
  return tryNative().catch(function(){ return tryZxing(); }).catch(function(){
    throw new Error('Čárový kód se na fotce nepodařilo rozpoznat. Zkus vyfotit kód zblízka, na ostro a rovně.');
  });
}
function parseQuantityString(str){
  if(!str) return null;
  var m = String(str).match(/([\d]+[.,]?[\d]*)\s*(ml|l|g|kg)\b/i);
  if(!m) return null;
  var val = parseFloat(m[1].replace(',', '.'));
  if(!isFinite(val) || val<=0) return null;
  var unit = m[2].toLowerCase();
  if(unit==='l'){ val*=1000; unit='ml'; }
  if(unit==='kg'){ val*=1000; unit='g'; }
  return {value: Math.round(val), unit: unit};
}

}

  if(!m) throw new Error('AI nevrátila hmotnost kusu.');
  var v = parseFloat(m[1].replace(',', '.'));
  if(!isFinite(v) || v<=0) throw new Error('AI nevrátila platnou hmotnost kusu.');
  return v;
}
function callGeminiGramsPerPiece(name, apiKey){

function estimateGramsPerPiece(name){
  var keys = state.aiKeys||{};
  var chain = [];
  if(keys.gemini) chain.push(function(){ return callGeminiGramsPerPiece(name, keys.gemini); });
  if(keys.groq) chain.push(function(){ return callGroqGramsPerPiece(name, keys.groq); });
  if(keys.openrouter) chain.push(function(){ return callOpenRouterGramsPerPiece(name, keys.openrouter); });
  if(!chain.length) return Promise.reject(new Error('Pro přepočet kusů na gramy u neznámé suroviny přidej v nastavení aspoň jeden AI API klíč (nebo přepni na gramy).'));
  var i = 0;
  function attempt(lastErr){
    if(i>=chain.length) return Promise.reject(lastErr||new Error('Odhad hmotnosti kusu se nezdařil.'));
    var fn = chain[i++];
    return retryOn429(fn, 2, 1500).catch(function(err){ return attempt(err); });
  }
  return attempt();
}
// Převede zadané množství (qtyRaw, jednotka 'g' nebo 'ks') na gramy. U 'ks' nejdřív
// zkusí tabulku typických hmotností, pak AI odhad hmotnosti jednoho kusu.
function resolveIngredientGrams(name, qtyRaw, unit){
  var qty = Number(qtyRaw)||0;
  if(unit!=='ks') return Promise.resolve({grams: qty, pieceWeight: null});
  var table = lookupTypicalPieceWeight(name);
  if(table) return Promise.resolve({grams: Math.round(qty*table), pieceWeight: table});
  return estimateGramsPerPiece(name).then(function(g){
    return {grams: Math.round(qty*g), pieceWeight: g};
  });
}

function normalizeSearchText(s){

function getFoodHistorySuggestions(query){

    (state.foodLog[day]||[]).forEach(function(f){
      if(!f.name) return;

  });
  var items = Object.keys(seen).map(function(k){ return seen[k]; });

function todayLocalISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function formatDateShort(iso){ var p=iso.split('-'); return p[2]+'.'+p[1]+'.'; }

function formatDateRelative(iso){

  var yesterday = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  if(iso===today) return 'Dnes';

function isoAddDays(iso, delta){

function isoTimeHM(isoString){

// Pokud předchozí den přejedl plán, nabídne se otázka, jestli se má dnešní cíl o přebytek snížit.
// Dokud se uživatel nerozhodne, cíl zůstává normální (nesnížený) a zobrazí se otázka ano/ne.
function calcAdjustedTarget(plan, foodLog, dayIso){
  var prevIso = isoAddDays(dayIso, -1);
  var prevList = (foodLog && foodLog[prevIso]) || [];
  var prevKcal = foodTotals(prevList).kcal;
  var overage = Math.round(prevKcal - plan.target);
  if(overage <= 0){
    return {target:plan.target, adjustment:0, overage:0, pending:false};
  }
  var choice = state.calAdjustChoices ? state.calAdjustChoices[dayIso] : undefined;
  if(choice===true){
    var adjustedTarget = Math.max(plan.floor, plan.target - overage);
    var appliedAdjustment = plan.target - adjustedTarget;
    return {target:adjustedTarget, adjustment:appliedAdjustment, overage:overage, pending:false};
  }
  if(choice===false){
    return {target:plan.target, adjustment:0, overage:overage, pending:false, declined:true};
  }
  return {target:plan.target, adjustment:0, overage:overage, pending:true};
}

function arcPath(cx,cy,r,a1,a2){ var s=polarPoint(cx,cy,r,a1), e=polarPoint(cx,cy,r,a2); var large=(a1-a2>180)?1:0; return 'M '+s.x+' '+s.y+' A '+r+' '+r+' 0 '+large+' 1 '+e.x+' '+e.y; }

var MONTH_ABBR_CS = ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
function formatMonthShort(iso){ var p=iso.split('-'); var mi=parseInt(p[1],10)-1; return MONTH_ABBR_CS[mi]+' '+p[0].slice(2); }
function formatYearShort(iso){ return iso.split('-')[0]; }
function formatMonthFull(iso){ var p=iso.split('-'); var mi=parseInt(p[1],10)-1; return MONTH_ABBR_CS[mi]+' '+p[0]; }
// Seskupí záznamy váhy podle zvoleného rozsahu ('days' = beze změny, 'months'/'years' =
// jeden bod za období, hodnota = průměr všech záznamů v daném období).
function groupEntriesByRange(entries, range){
  var asc = sortedAsc(entries);
  if(range!=='months' && range!=='years') return asc;
  var keyLen = range==='months' ? 7 : 4;
  var buckets = {};
  var order = [];
  asc.forEach(function(e){
    var key = e.date.slice(0, keyLen);
    if(!buckets[key]){ buckets[key] = {sum:0, count:0, date:e.date, weight:e.weight}; order.push(key); }
    var b = buckets[key];
    b.sum += e.weight; b.count += 1;
    if(e.date >= b.date){ b.date = e.date; b.weight = e.weight; }
  });
  return order.map(function(key){
    var b = buckets[key];
    return {id:'agg-'+key, date:b.date, weight: +(b.sum/b.count).toFixed(1)};
  });
}
function renderChart(entries, minNormal, maxNormal, labelMode){
  labelMode = labelMode || 'day';
  var data = sortedAsc(entries);
  if(data.length<2) return null;
  var W=600,H=260,padL=42,padR=14,padT=14,padB=28;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  var times = data.map(function(d){ return new Date(d.date).getTime(); });
  var minTs=Math.min.apply(null,times), maxTs=Math.max.apply(null,times);
  var weights = data.map(function(d){ return d.weight; });
  var yMin = Math.min.apply(null, weights.concat([minNormal])) - 2;
  var yMax = Math.max.apply(null, weights.concat([maxNormal])) + 2;
  function xScale(ts){ return padL + (maxTs===minTs?0.5:(ts-minTs)/(maxTs-minTs))*plotW; }
  function yScale(w){ return padT + (1-(w-yMin)/(yMax-yMin))*plotH; }

  var bandY1=yScale(maxNormal), bandY2=yScale(minNormal);
  var bandRect = '<rect x="'+padL+'" y="'+bandY1+'" width="'+plotW+'" height="'+(bandY2-bandY1)+'" fill="'+COLORS.accentSoft+'" opacity="0.7"/>';

  var gridY='';
  var ySteps=4;
  for(var i=0;i<=ySteps;i++){
    var val = yMin + (yMax-yMin)*i/ySteps;
    var y = yScale(val);
    gridY += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="'+COLORS.line+'" stroke-width="1"/>';
    gridY += '<text x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="'+COLORS.inkMuted+'" font-family="JetBrains Mono, monospace">'+val.toFixed(0)+'</text>';
  }

  var pts = data.map(function(d){ return xScale(new Date(d.date).getTime())+','+yScale(d.weight); });
  var polyline = '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+COLORS.accent+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';

  function fmtLabel(iso){
    if(labelMode==='month') return formatMonthShort(iso);
    if(labelMode==='year') return formatYearShort(iso);
    return formatDateShort(iso);
  }
  function fmtTooltipDate(iso){
    if(labelMode==='month') return formatMonthFull(iso)+' (průměr)';
    if(labelMode==='year') return iso.slice(0,4)+' (průměr)';
    return formatDateFull(iso);
  }
  var dots = data.map(function(d){
    var x=xScale(new Date(d.date).getTime()), y=yScale(d.weight);
    return '<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+COLORS.accent+'"><title>'+fmtTooltipDate(d.date)+': '+d.weight+' kg</title></circle>';
  }).join('');

  var xLabelStep = Math.max(1, Math.ceil(data.length/6));
  var xLabels='';
  data.forEach(function(d,i){
    if(i%xLabelStep===0 || i===data.length-1){
      var x=xScale(new Date(d.date).getTime());
      xLabels += '<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="'+COLORS.inkMuted+'" font-family="JetBrains Mono, monospace">'+fmtLabel(d.date)+'</text>';
    }
  });

  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;">'+
    bandRect + gridY + polyline + dots + xLabels + '</svg>';
}

        '<animateTransform attributeName="transform" type="scale" values="1;1.015;1" dur="2s" repeatCount="indefinite" additive="sum"/>'+
      '</g>';
  } else { // squat
    base =
      '<g>'+head+
        '<line x1="60" y1="45" x2="46" y2="65" stroke="'+ink+'" stroke-width="3" stroke-linecap="round"/>'+
        '<line x1="60" y1="45" x2="74" y2="65" stroke="'+ink+'" stroke-width="3" stroke-linecap="round"/>'+
        '<line x1="60" y1="35" x2="60" y2="80" stroke="'+ink+'" stroke-width="3.2"/>'+
        '<animateTransform attributeName="transform" type="translate" values="0 0;0 15;0 0" dur="1.5s" repeatCount="indefinite"/>'+

      '<line x1="60" y1="80" x2="46" y2="132" stroke="'+accent+'" stroke-width="3.2">'+

  }

  return '<svg viewBox="0 0 120 150" class="figure-svg">'+
    '<line x1="10" y1="135" x2="110" y2="135" stroke="'+COLORS.line+'" stroke-width="2"/>'+

function render(){
  var app = document.getElementById('app');
  if(!state.profile){
    app.innerHTML = renderOnboarding();
    attachOnboardingEvents();
    return;
  }
  app.innerHTML = renderMain();
  attachMainEvents();
  initMatrixRain();
}

function attachOnboardingEvents(){
  var sexSeg = document.getElementById('ob-sex-seg');
  sexSeg.querySelectorAll('.seg-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      sexSeg.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('ob-sex').value = btn.getAttribute('data-val');
    });
  });

  function wirePaceSeg(prefix){
    var seg = document.getElementById(prefix+'-pace-seg');
    if(!seg) return;
    seg.querySelectorAll('.seg-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        seg.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        var val = btn.getAttribute('data-val');
        document.getElementById(prefix+'-pace').value = val;
        var goalKey = document.getElementById(prefix+'-goal').value;
        var tipEl = document.getElementById(prefix+'-pace-tip');
        if(tipEl) tipEl.textContent = paceByKey(goalKey, val).tip;
      });
    });
  }
  wirePaceSeg('ob');

  document.getElementById('ob-goal').addEventListener('change', function(){
    var goalKey = this.value;
    document.getElementById('ob-pace-wrap').innerHTML = paceOptionsHtml(goalKey, 'normal', 'ob');
    wirePaceSeg('ob');
  });

  document.getElementById('onboard-form').addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('ob-name').value.trim();
    var age = Number(document.getElementById('ob-age').value);
    var height = Number(document.getElementById('ob-height').value);
    var weight = Number(document.getElementById('ob-weight').value);
    var sex = document.getElementById('ob-sex').value;
    var goal = document.getElementById('ob-goal').value;
    var activity = document.getElementById('ob-activity').value;
    var paceInput = document.getElementById('ob-pace');
    var pace = paceInput ? paceInput.value : 'normal';
    var targetWeightRaw = document.getElementById('ob-target-weight').value;
    var targetWeight = targetWeightRaw ? Number(targetWeightRaw) : null;
    var err = document.getElementById('ob-error');
    err.innerHTML='';
    var msg='';
    if(!name) msg='Zadej prosím jméno.';
    else if(!age || age<1 || age>120) msg='Zadej platný věk.';
    else if(!height || height<100 || height>250) msg='Zadej výšku v centimetrech (100–250).';
    else if(!weight || weight<20 || weight>300) msg='Zadej váhu v kilogramech (20–300).';
    else if(targetWeight!==null && (targetWeight<20 || targetWeight>300)) msg='Zadej reálnou cílovou váhu v kilogramech (20–300).';
    if(msg){ err.innerHTML='<div class="form-error">'+ICONS.alert+' '+msg+'</div>'; return; }
    saveProfile({name:name, age:age, height:height, sex:sex, goal:goal, activity:activity, pace:pace, targetWeight:targetWeight});
    saveEntries([{id:uid(), date:todayLocalISO(), weight:weight}]);
    render();
  });
}

function renderMain(){
  var profile = state.profile;

  var asc = sortedAsc(entries);
  var latest = asc[asc.length-1];

  var cat = CATEGORY_TEXT[getCategoryKey(bmi)];
  var minNormal = +(18.5*(profile.height/100)*(profile.height/100)).toFixed(1);
  var maxNormal = +(25*(profile.height/100)*(profile.height/100)).toFixed(1);
  var delta = (latest && first && latest.id!==first.id) ? +(latest.weight-first.weight).toFixed(1) : 0;
  var deltaIcon = delta===0?ICONS.minus:(delta<0?ICONS.down:ICONS.up);

  var chartSvg = renderChart(chartEntries, minNormal, maxNormal, chartLabelMode);

      '<div class="dash-bmi-value" style="color:'+cat.color+'">'+bmi.toFixed(1)+'</div>'+
      '<div class="dash-bmi-sub">'+cat.label+'</div>'+
    '</button>'+
    '<button type="button" class="dash-stat-card" id="dash-weight-card" aria-label="Zobrazit sledování váhy">'+

      '<div class="dash-weight-value">'+latest.weight+' kg</div>'+
      '<div class="dash-weight-trend" style="color:'+deltaColor+'">'+deltaIcon+' '+Math.abs(delta)+' kg od začátku</div>'+

  html += '<section class="card fade-up" style="padding:14px 16px">'+
    '<div class="food-header-row" style="align-items:center;margin-bottom:8px"><div class="card-title" style="margin:0">Graf váhy</div>'+

      '<div class="empty-state">Přidej ještě aspoň jeden záznam a uvidíš graf progresu.</div>')+
  '</section>';

  if(state.saveError){
    html += '<div class="error-banner fade-up">'+ICONS.alert+'<span>'+esc(state.saveError)+'</span></div>';
  }

  if(state.canInstall || state.showIosInstallHint){
    html += '<section class="card install-banner fade-up">'+
      '<div class="install-banner-icon">'+ICONS.download+'</div>'+
      '<div class="install-banner-text"><div class="card-title" style="margin-bottom:2px">Nainstalovat aplikaci</div>'+
        '<p>'+(state.canInstall ? 'Přidej si Sinator Vitals na plochu a otevírej ji jako appku, i offline.' : 'Klepni na Sdílet '+ICONS.iosShare+' dole v prohlížeči a zvol „Přidat na plochu".')+'</p></div>'+

      '<button class="btn-icon subtle" id="dismiss-install-btn" aria-label="Zavřít">'+ICONS.x+'</button>'+
    '</section>';
  }

  var todayIso = todayLocalISO();

  var workModeToday = (state.workDayTypes && state.workDayTypes[todayIso]) || 'standard';

  var waterToday = Math.max(0, Number(state.waterLog[todayIso])||0);

  html += renderStreakCard(streaks);

  html += renderFastingCard();

  var foodDay = state.selectedFoodDate || todayIso;

  var dayType = (state.dayTypes && state.dayTypes[foodDay]) || 'normal';

  var workModeInfo = WORK_DAY_TYPES.filter(function(t){ return t.key===workMode; })[0] || WORK_DAY_TYPES[0];

  var remainingKcal = dayTarget - foodT.kcal;
  var remColor = remainingKcal < 0 ? COLORS.obese : COLORS.normal;
  var dayTypeSeg = '<div class="field" style="margin-bottom:12px"><span>Typ dne</span>'+

function renderExerciseCard(ex, tab, idx){
  var badge = ex.eq==='bodyweight' ?
      '<span class="eq-badge bodyweight">'+ICONS.body+' vlastní váha</span>' :
    ex.eq==='dumbbell' ?
      '<span class="eq-badge dumbbell">'+ICONS.dumbbell+' činky</span>' :
      '<span class="eq-badge bodyweight">'+ICONS.body+' váha</span><span class="eq-badge dumbbell">'+ICONS.dumbbell+' i činky</span>';
  return '<div class="exercise-item" data-tab="'+tab+'" data-idx="'+idx+'" role="button" tabindex="0">'+
    '<div class="exercise-head"><div class="exercise-name">'+esc(ex.name)+'</div><div class="exercise-badges">'+badge+'</div></div>'+
    '<div class="exercise-meta">'+esc(ex.group)+' · '+esc(ex.sets)+'</div>'+
    '<p class="exercise-tip">'+esc(ex.tip)+'</p>'+
    '<div class="exercise-open-hint">Zobrazit postup a animaci '+ICONS.chevronDown.replace('width="15" height="15"','width="12" height="12" style="transform:rotate(-90deg)"')+'</div>'+
  '</div>';
}

// Sečte gramy a nutrienty všech surovin receptu (kcal/protein/carbs/fat pro
// každou surovinu se počítají z její vlastní "na 100 g" reference a aktuální
// gramáže, viz macrosFromPer100).
function recipeTotals(draft){
  var ings = (draft && draft.ingredients) || [];
  var t = {grams:0, kcal:0, protein:0, carbs:0, fat:0};
  ings.forEach(function(ing){
    var m = macrosFromPer100(ing.per100, ing.qty, 'g');
    t.grams += ing.qty;
    t.kcal += m.kcal; t.protein += m.protein; t.carbs += m.carbs; t.fat += m.fat;
  });
  return t;
}

  } else {

      '</div>'+

function attachMainEvents(){
  var editBtn = document.getElementById('edit-profile-btn');
  if(editBtn) editBtn.addEventListener('click', function(){ state.editingProfile=true; state.confirmReset=false; render(); });

  var openNotifBtn = document.getElementById('open-notif-btn');
  if(openNotifBtn) openNotifBtn.addEventListener('click', function(){ state.showNotifModal=true; render(); });

  var notifOverlay = document.getElementById('notif-overlay');
  if(notifOverlay){
    notifOverlay.addEventListener('click', function(e){ if(e.target===notifOverlay){ state.showNotifModal=false; render(); } });
    var notifCloseBtn = document.getElementById('notif-close-btn');
    if(notifCloseBtn) notifCloseBtn.addEventListener('click', function(){ state.showNotifModal=false; render(); });

    var notifPermBtn = document.getElementById('notif-request-perm-btn');
    if(notifPermBtn) notifPermBtn.addEventListener('click', function(){
      if(!notifSupported()) return;
      Notification.requestPermission().then(function(){ render(); });
    });

    function wireNotifSeg(segId, hiddenId){
      var seg = document.getElementById(segId);
      if(!seg) return;
      seg.querySelectorAll('.seg-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          seg.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          document.getElementById(hiddenId).value = btn.getAttribute('data-val');
        });
      });
    }
    wireNotifSeg('notif-master-seg', 'notif-enabled');
    wireNotifSeg('notif-water-seg', 'notif-water-enabled');
    wireNotifSeg('notif-evening-seg', 'notif-evening-enabled');
    wireNotifSeg('notif-morning-seg', 'notif-morning-enabled');

    var notifForm = document.getElementById('notif-form');
    if(notifForm) notifForm.addEventListener('submit', function(e){
      e.preventDefault();
      var enabled = document.getElementById('notif-enabled').value==='1';
      var cfg = {
        enabled: enabled,
        waterEnabled: document.getElementById('notif-water-enabled').value==='1',
        waterIntervalHours: Number(document.getElementById('notif-water-interval').value)||3,
        waterStart: document.getElementById('notif-water-start').value || '08:00',
        waterEnd: document.getElementById('notif-water-end').value || '22:00',
        eveningEnabled: document.getElementById('notif-evening-enabled').value==='1',
        eveningTime: document.getElementById('notif-evening-time').value || '21:00',
        morningEnabled: document.getElementById('notif-morning-enabled').value==='1',
        morningTime: document.getElementById('notif-morning-time').value || '07:00'
      };
      saveNotifConfig(cfg);
      if(enabled && notifSupported() && Notification.permission==='default'){
        Notification.requestPermission().then(function(){ scheduleAllNotifications(); });
      } else {
        scheduleAllNotifications();
      }
      state.showNotifModal=false;
      render();
    });
  }

  var installBtn = document.getElementById('install-app-btn');
  if(installBtn) installBtn.addEventListener('click', function(){
    if(!deferredInstallPrompt) return;
    installBtn.disabled = true;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function(){
      deferredInstallPrompt = null;
      state.canInstall = false;
      render();
    }).catch(function(){ state.canInstall = false; render(); });
  });

  var dismissInstallBtn = document.getElementById('dismiss-install-btn');
  if(dismissInstallBtn) dismissInstallBtn.addEventListener('click', function(){
    state.canInstall = false;
    state.showIosInstallHint = false;
    try{ localStorage.setItem('sv_install_dismissed', '1'); }catch(e){}
    render();
  });

  var goalBtn = document.getElementById('open-goal-btn');
  if(goalBtn) goalBtn.addEventListener('click', function(){ state.editingProfile=true; state.confirmReset=false; render(); });

  var openExBtn = document.getElementById('open-exercise-btn');
  if(openExBtn) openExBtn.addEventListener('click', function(){ state.showExerciseModal=true; state.exerciseDetail=null; render(); });

  var openBmiBtn = document.getElementById('open-bmi-btn');
  if(openBmiBtn) openBmiBtn.addEventListener('click', function(){ state.showBmiModal=true; render(); });

  var openAboutMeBtn = document.getElementById('open-about-me-btn');
  if(openAboutMeBtn) openAboutMeBtn.addEventListener('click', function(){ state.showAboutMeModal=true; render(); });

  var aboutMeOverlay = document.getElementById('about-me-overlay');
  if(aboutMeOverlay){
    aboutMeOverlay.addEventListener('click', function(e){ if(e.target===aboutMeOverlay){ state.showAboutMeModal=false; render(); } });
    var aboutMeCloseBtn = document.getElementById('about-me-close-btn');
    if(aboutMeCloseBtn) aboutMeCloseBtn.addEventListener('click', function(){ state.showAboutMeModal=false; render(); });
  }

  var bmiOverlay = document.getElementById('bmi-overlay');
  if(bmiOverlay){
    bmiOverlay.addEventListener('click', function(e){ if(e.target===bmiOverlay){ state.showBmiModal=false; render(); } });
    var bmiCloseBtn = document.getElementById('bmi-close-btn');
    if(bmiCloseBtn) bmiCloseBtn.addEventListener('click', function(){ state.showBmiModal=false; render(); });
  }

  var alcCard = document.getElementById('alcohol-card');
  if(alcCard) alcCard.addEventListener('click', function(){ state.showAlcoholModal=true; render(); });

  var alcOverlay = document.getElementById('alcohol-overlay');
  if(alcOverlay){
    alcOverlay.addEventListener('click', function(e){ if(e.target===alcOverlay){ state.showAlcoholModal=false; render(); } });
    var alcCloseBtn = document.getElementById('alcohol-close-btn');
    if(alcCloseBtn) alcCloseBtn.addEventListener('click', function(){ state.showAlcoholModal=false; render(); });
    function openAddFromAlcohol(){
      state.showAlcoholModal=false;
      state.selectedFoodDate=null;
      state.showAddFoodModal=true; state.foodDraft={}; state.foodAiError=''; state.foodAiLoading=false; state.foodLookupError=''; state.foodLookupNote=''; state.foodLookupLoading=null;
      state.foodInputMode='alcohol'; state.foodPhoto=null; state.barcodePhoto=null;
      state.alcoholSearchQuery=''; state.alcoholAddedName='';
      state.addFoodMealType = guessMealType();
      state.editingFoodId=null; state.editingFoodDay=null;
      render();
    }
    var alcAddBtn = document.getElementById('alcohol-add-btn');
    if(alcAddBtn) alcAddBtn.addEventListener('click', openAddFromAlcohol);
    var alcAddBtn2 = document.getElementById('alcohol-add-btn-2');
    if(alcAddBtn2) alcAddBtn2.addEventListener('click', openAddFromAlcohol);
  }

  function openAddFoodModal(){
    state.showAddFoodModal=true; state.foodDraft={}; state.foodAiError=''; state.foodAiLoading=false; state.foodLookupError=''; state.foodLookupNote=''; state.foodLookupLoading=null;
    state.foodInputMode='text'; state.foodPhoto=null; state.barcodePhoto=null;
    state.alcoholSearchQuery=''; state.alcoholAddedName='';
    state.addFoodMealType = guessMealType();
    state.editingFoodId=null; state.editingFoodDay=null;
    render();
  }
  var openAddFoodBtn = document.getElementById('open-add-food-btn');
  if(openAddFoodBtn) openAddFoodBtn.addEventListener('click', openAddFoodModal);
  var dashAddFoodBtn = document.getElementById('dash-add-food-btn');
  if(dashAddFoodBtn) dashAddFoodBtn.addEventListener('click', openAddFoodModal);

  var quickWeightForm = document.getElementById('quick-weight-form');
  if(quickWeightForm) quickWeightForm.addEventListener('submit', function(e){
    e.preventDefault();
    var input = document.getElementById('quick-weight-input');
    var weight = Number(input.value);
    var err = document.getElementById('quick-weight-error');
    err.innerHTML='';
    if(!weight || weight<20 || weight>300){
      err.innerHTML = '<div class="form-error">'+ICONS.alert+' Zadej platnou váhu v kg (20–300).</div>';
      return;
    }
    var today = todayLocalISO();
    var existing = state.entries.filter(function(en){ return en.date===today; })[0];
    var list;
    if(existing){
      list = state.entries.map(function(en){ return en.id===existing.id ? Object.assign({}, en, {weight:weight}) : en; });
    } else {
      list = state.entries.concat([{id:uid(), date:today, weight:weight}]);
    }
    saveEntries(list);
    render();
  });

  var dashChartExpandBtn = document.getElementById('dash-chart-expand-btn');
  if(dashChartExpandBtn) dashChartExpandBtn.addEventListener('click', function(){ state.showAboutMeModal=true; render(); });

  var dashBmiCard = document.getElementById('dash-bmi-card');
  if(dashBmiCard) dashBmiCard.addEventListener('click', function(){ state.showBmiModal=true; render(); });
  var dashWeightCard = document.getElementById('dash-weight-card');
  if(dashWeightCard) dashWeightCard.addEventListener('click', function(){ state.showAboutMeModal=true; render(); });

  var waterPlusBtn = document.getElementById('water-plus-btn');
  if(waterPlusBtn) waterPlusBtn.addEventListener('click', function(){ addWater(250, todayLocalISO()); render(); });
  var waterMinusBtn = document.getElementById('water-minus-btn');
  if(waterMinusBtn) waterMinusBtn.addEventListener('click', function(){ addWater(-250, todayLocalISO()); render(); });

  document.querySelectorAll('[data-meal-add]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var mt = btn.getAttribute('data-meal-add');
      state.addFoodMealType = mt;
      state.showAddFoodModal=true; state.foodDraft={}; state.foodAiError=''; state.foodAiLoading=false; state.foodLookupError=''; state.foodLookupNote=''; state.foodLookupLoading=null;
      state.foodInputMode='text'; state.foodPhoto=null; state.barcodePhoto=null;
      state.alcoholSearchQuery=''; state.alcoholAddedName='';
      state.editingFoodId=null; state.editingFoodDay=null;
      render();
    });
  });

  document.querySelectorAll('[data-fav-food-id]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-fav-food-id');
      var day = btn.getAttribute('data-fav-food-day');
      var entry = (state.foodLog[day]||[]).filter(function(f){ return f.id===id; })[0];
      if(!entry) return;
      toggleFavoriteFood(entry);
      render();
    });
  });

  document.querySelectorAll('[data-edit-food-id]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-edit-food-id');
      var day = btn.getAttribute('data-edit-food-day');
      var entry = (state.foodLog[day]||[]).filter(function(f){ return f.id===id; })[0];
      if(!entry) return;
      state.editingFoodId = id;
      state.editingFoodDay = day;
      state.foodDraft = Object.assign({}, entry);
      state.addFoodMealType = entry.mealType || guessMealType();
      state.foodInputMode = 'text';
      state.foodPhoto = null; state.barcodePhoto = null;
      state.foodAiError=''; state.foodAiLoading=false; state.foodLookupError=''; state.foodLookupNote=''; state.foodLookupLoading=null;
      state.showAddFoodModal = true;
      render();
    });
  });

  document.querySelectorAll('[data-day-type]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var day = btn.getAttribute('data-day-type-day');
      var val = btn.getAttribute('data-day-type');
      var dt = Object.assign({}, state.dayTypes);
      if(val==='normal') delete dt[day]; else dt[day] = val;
      saveDayTypes(dt);
      render();
    });
  });

  document.querySelectorAll('[data-work-mode]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var day = btn.getAttribute('data-work-mode-day');
      var val = btn.getAttribute('data-work-mode');
      var wt = Object.assign({}, state.workDayTypes);
      if(val==='standard') delete wt[day]; else wt[day] = val;
      saveWorkDayTypes(wt);
      render();
    });
  });

  var veggiePlusBtn = document.getElementById('veggie-plus-btn');
  if(veggiePlusBtn) veggiePlusBtn.addEventListener('click', function(){ addVeggie(todayLocalISO(), 1); render(); });
  var veggieMinusBtn = document.getElementById('veggie-minus-btn');
  if(veggieMinusBtn) veggieMinusBtn.addEventListener('click', function(){ addVeggie(todayLocalISO(), -1); render(); });

  var fastingSetupBtn = document.getElementById('fasting-setup-btn');
  if(fastingSetupBtn) fastingSetupBtn.addEventListener('click', function(){ state.showFastingEdit=true; render(); });
  var fastingCancelBtn = document.getElementById('fasting-cancel-btn');
  if(fastingCancelBtn) fastingCancelBtn.addEventListener('click', function(){ state.showFastingEdit=false; render(); });
  var fastingDisableBtn = document.getElementById('fasting-disable-btn');
  if(fastingDisableBtn) fastingDisableBtn.addEventListener('click', function(){
    saveFastingConfig(Object.assign({}, state.fastingConfig, {enabled:false}));
    state.showFastingEdit=false;
    render();
  });
  var fastingForm = document.getElementById('fasting-form');
  if(fastingForm) fastingForm.addEventListener('submit', function(e){
    e.preventDefault();
    var startRaw = document.getElementById('fasting-eat-start').value;
    var endRaw = document.getElementById('fasting-eat-end').value;
    var errEl = document.getElementById('fasting-error');
    errEl.innerHTML='';
    var sm = /^(\d{1,2}):(\d{2})$/.exec(startRaw||'');
    var em = /^(\d{1,2}):(\d{2})$/.exec(endRaw||'');
    if(!sm || !em){ errEl.innerHTML='<div class="form-error">'+ICONS.alert+' Zadej platný čas začátku i konce okna.</div>'; return; }
    var startMin = Number(sm[1])*60+Number(sm[2]);
    var endMin = Number(em[1])*60+Number(em[2]);
    if(endMin<=startMin){ errEl.innerHTML='<div class="form-error">'+ICONS.alert+' Konec okna musí být později než začátek (v rámci jednoho dne).</div>'; return; }
    saveFastingConfig({enabled:true, eatStart:startMin, eatEnd:endMin});
    state.showFastingEdit=false;
    render();
  });

  document.querySelectorAll('[data-cal-adjust]').forEach(function(btn){

    function addRecipeIngredientFromPer100(name, matchedName, per100, qtyRaw, unit){

          pieceNote: (unit==='ks') ? (qtyRaw+' ks × ~'+Math.round(conv.pieceWeight)+' g') : null
        }]);
        rd.ingName = ''; rd.ingQty = 100; rd.ingUnit = 'g'; rd.ingLoading = false; rd.ingError = '';

      };
      var fillAlcoholDraft = function(name, kcal, alcoholG, volumeMl, abv, estimated){
        state.foodDraft = Object.assign({}, state.foodDraft, {
          name:name, kcal:kcal, protein:0, carbs:0, fat:0,

      };
      var renderAlcSuggestions = function(q, presetResults, aiState){
        var html='';
        presetResults.forEach(function(p){
          var idx = ALCOHOL_PRESETS.indexOf(p);
          html += '<div class="desc-suggestion-item" data-alc-preset-idx="'+idx+'">'+
            '<div class="desc-suggestion-name">'+esc(p.name)+'</div>'+
            '<div class="desc-suggestion-meta">'+p.volumeMl+' ml · '+p.abv+' %</div>'+
          '</div>';
        });
        if(aiState==='loading'){
          html += '<div class="desc-suggestion-loading"><span class="ai-spinner" style="width:11px;height:11px;margin-right:6px"></span>Hledám přes AI…</div>';
        } else if(aiState && aiState.result){
          var r = aiState.result;
          html += '<div class="desc-suggestion-item" data-alc-ai="1">'+

            var p = ALCOHOL_PRESETS[idx];

        var aiBtn = document.getElementById('alcohol-ai-search-btn');
        if(aiBtn){

            return;

          renderAlcSuggestions(q, alcoholPresetSearch(q), {result:result});
        }).catch(function(err){

      alcoholSearchInput.addEventListener('input', function(){

    var foodDescInput = document.getElementById('food-desc');

      var renderDescSuggestions = function(historyItems, offItems, loadingOff, ktItems, loadingKt, ktFillingSlug){
        ktItems = ktItems || []; loadingKt = !!loadingKt;
        var html = '';
        historyItems.forEach(function(item){
          html += '<div class="desc-suggestion-item" data-src="history" data-name="'+esc(item.name)+'" data-kcal="'+(item.kcal||0)+'" data-protein="'+(item.protein||0)+'" data-carbs="'+(item.carbs||0)+'" data-fat="'+(item.fat||0)+'" data-alcohol="'+(item.alcohol||0)+'" data-volume="'+(item.volumeMl!=null?item.volumeMl:'')+'" data-abv="'+(item.abv||'')+'">'+
            '<div class="desc-suggestion-name">'+esc(item.name)+'</div>'+
            '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><span class="desc-suggestion-tag">už jsi jedl(a)</span><span class="desc-suggestion-meta">'+Math.round(item.kcal||0)+' kcal</span></div>'+
          '</div>';
        });
        ktItems.forEach(function(item){
          var isFilling = ktFillingSlug===item.slug;
          html += '<div class="desc-suggestion-item" data-src="kt" data-slug="'+esc(item.slug)+'" data-name="'+esc(item.name)+'">'+
            '<div class="desc-suggestion-name">'+esc(item.name)+'</div>'+
            (isFilling ? '<span class="ai-spinner" style="width:11px;height:11px;flex-shrink:0"></span>' : '<span class="desc-suggestion-tag">Kalorické tabulky</span>')+
          '</div>';
        });
        if(loadingKt){
          html += '<div class="desc-suggestion-loading"><span class="ai-spinner" style="width:11px;height:11px;margin-right:6px"></span>Hledám na Kalorických tabulkách…</div>';
        }
        offItems.forEach(function(item){
          html += '<div class="desc-suggestion-item" data-src="off" data-name="'+esc(item.name)+'" data-kcal100="'+item.kcal100+'" data-protein100="'+item.protein100+'" data-carbs100="'+item.carbs100+'" data-fat100="'+item.fat100+'" data-alcohol100="'+(item.alcohol100||0)+'" data-qty="'+item.defaultQty+'" data-unit="'+item.defaultUnit+'">'+
            '<div class="desc-suggestion-name">'+esc(item.name)+'</div>'+
            '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><span class="desc-suggestion-tag">databáze</span><span class="desc-suggestion-meta">'+Math.round(item.kcal100)+' kcal/100'+(item.defaultUnit==='ml'?'ml':'g')+'</span></div>'+
          '</div>';
        });
        if(loadingOff){
          html += '<div class="desc-suggestion-loading"><span class="ai-spinner" style="width:11px;height:11px;margin-right:6px"></span>Hledám v databázi…</div>';
        }
        if(!html){ closeDescSuggestions(); return; }
        foodDescSuggBox.innerHTML = html;
        foodDescSuggBox.style.display='block';
        foodDescSuggBox.querySelectorAll('.desc-suggestion-item').forEach(function(el){
          el.addEventListener('mousedown', function(ev){ ev.preventDefault(); }); // keep focus so blur doesn't close before click
          el.addEventListener('click', function(){
            var src = el.getAttribute('data-src');
            var name = el.getAttribute('data-name');
            if(src==='history'){
              state.foodDraft = Object.assign({}, state.foodDraft, {
                description: name, name: name,
                kcal: Number(el.getAttribute('data-kcal'))||0,
                protein: Number(el.getAttribute('data-protein'))||0,
                carbs: Number(el.getAttribute('data-carbs'))||0,
                fat: Number(el.getAttribute('data-fat'))||0,
                alcohol: Number(el.getAttribute('data-alcohol'))||0,
                volumeMl: el.getAttribute('data-volume') ? Number(el.getAttribute('data-volume')) : null,
                abv: el.getAttribute('data-abv') ? Number(el.getAttribute('data-abv')) : 0,
                alcoholEstimated: false
              });
              state.foodAiError='';
              render();
            } else if(src==='kt'){
              var slug = el.getAttribute('data-slug');
              // znovu vykreslit se spinnerem u vybrané položky, ostatní necháme být
              renderDescSuggestions(historyItems, offItems, loadingOff, ktItems, false, slug);
              fetch('/api/nutrition-lookup?source=kalorickeTabulky&slug='+encodeURIComponent(slug))
                .then(function(res){ return res.json(); })
                .then(function(data){
                  if(!data || !data.success){ state.foodAiError = (data && data.message) || 'Načtení z Kalorických tabulek se nezdařilo.'; render(); return; }
                  var finalName = data.matchedName || name;
                  var qtyEl = document.getElementById('food-qty');
                  var unitEl = document.getElementById('food-unit');
                  var qty = qtyEl ? (Number(qtyEl.value)||1) : 1;
                  var unitKey = unitEl ? unitEl.value : 'porce';
                  var per100 = {kcal:data.kcal, protein:data.protein, carbs:data.carbs, fat:data.fat};
                  var macros = macrosFromPer100(per100, qty, unitKey);
                  state.foodDraft = Object.assign({}, state.foodDraft, {
                    description: finalName, name: finalName,
                    per100: per100,
                    kcal: macros.kcal, protein: macros.protein, carbs: macros.carbs, fat: macros.fat,
                    knownFoodMatch:false
                  });
                  state.foodAiError='';
                  closeDescSuggestions();
                  render();
                }).catch(function(){
                  state.foodAiError = 'Načtení z Kalorických tabulek se nezdařilo.';
                  render();
                });
            } else {
              var qtyElOff = document.getElementById('food-qty');
              var qty = qtyElOff ? (Number(qtyElOff.value)||Number(el.getAttribute('data-qty'))||100) : (Number(el.getAttribute('data-qty'))||100);
              var isMl = el.getAttribute('data-unit')==='ml';
              var factor = qty/100;
              var kcal100 = Number(el.getAttribute('data-kcal100'))||0;
              var protein100 = Number(el.getAttribute('data-protein100'))||0;
              var carbs100 = Number(el.getAttribute('data-carbs100'))||0;
              var fat100 = Number(el.getAttribute('data-fat100'))||0;
              var alcohol100 = Number(el.getAttribute('data-alcohol100'))||0;
              var alcoholG = alcohol100 ? Math.round(qty*(alcohol100/100)*0.79) : 0;
              var per100 = {kcal:kcal100, protein:protein100, carbs:carbs100, fat:fat100, alcohol100:alcohol100, isMl:isMl, rawQtyFactor:true};
              state.foodDraft = Object.assign({}, state.foodDraft, {
                description: name, name: name,
                per100: per100,
                kcal: Math.round(kcal100*factor),
                protein: Math.round(protein100*factor),
                carbs: Math.round(carbs100*factor),
                fat: Math.round(fat100*factor),
                alcohol: alcoholG,
                volumeMl: (alcoholG>0 && isMl) ? Math.round(qty) : null,
                abv: alcoholG>0 ? (Math.round(alcohol100*10)/10) : 0,
                alcoholEstimated: false
              });
              state.foodAiError='';
              render();
            }
          });
        });
      };
      foodDescInput.addEventListener('input', function(){
        var q = foodDescInput.value.trim();
        clearTimeout(descDebounce);
        if(q.length<2){ closeDescSuggestions(); return; }
        var historyItems = getFoodHistorySuggestions(q);
        renderDescSuggestions(historyItems, [], false, [], false);
        var myToken = ++descReqToken;
        descDebounce = setTimeout(function(){
          renderDescSuggestions(historyItems, [], true, [], true);
          var ktPromise = searchKtSuggestions(q);
          var offPromise = searchOpenFoodFactsText(q).catch(function(){ return []; });
          ktPromise.then(function(ktItems){
            if(myToken!==descReqToken) return;
            renderDescSuggestions(historyItems, [], true, ktItems, false);
            offPromise.then(function(offItems){
              if(myToken!==descReqToken) return;
              renderDescSuggestions(historyItems, offItems, false, ktItems, false);
            });
          });
        }, 400);
      });
      foodDescInput.addEventListener('blur', function(){
        setTimeout(closeDescSuggestions, 180);
      });
    }

    var foodPhotoTrigger = document.getElementById('food-photo-trigger');

    function runFoodPhotoAi(){
      if(!state.foodPhoto) return;
      state.foodAiLoading = true; state.foodAiError='';
      render();
      var qtyEl = document.getElementById('food-qty'), unitEl = document.getElementById('food-unit');
      var qty = qtyEl ? (Number(qtyEl.value)||null) : null;
      var unitKey = unitEl ? unitEl.value : null;
      decodeBarcodeFromDataUrl(state.foodPhoto).then(function(code){
        return lookupOpenFoodFacts(code);
      }).then(function(info){
        var draft = applyKnownFoodOverride(offInfoToDraft(info), qty, unitKey);
        state.foodDraft = Object.assign({}, state.foodDraft, draft);
        state.foodAiLoading = false;
        state.foodAiError = '';
        render();
      }).catch(function(){
        // na fotce nešel najít/rozpoznat čárový kód, nebo produkt není v databázi — odhadneme z fotky pomocí AI
        estimateFoodFromImage(state.foodPhoto, false).then(function(result){
          result = applyKnownFoodOverride(result, qty, unitKey);
          state.foodDraft = Object.assign({}, state.foodDraft, result);
          state.foodAiLoading = false;
          render();

          state.foodAiError = friendlyAiError(err);

    var foodPhotoInput = document.getElementById('food-photo-input');

      reader.onload = function(ev){
        state.foodPhoto = ev.target.result;

        runFoodPhotoAi();
      };
      reader.readAsDataURL(file);

    var foodPhotoAiBtn = document.getElementById('food-photo-ai-btn');

    var barcodePhotoTrigger = document.getElementById('barcode-photo-trigger');
    if(barcodePhotoTrigger) barcodePhotoTrigger.addEventListener('click', function(){
      document.getElementById('barcode-photo-input').click();
    });

    function runBarcodeScan(){
      if(!state.barcodePhoto) return;
      state.foodAiLoading = true; state.foodAiError='';
      render();
      var qtyEl = document.getElementById('food-qty'), unitEl = document.getElementById('food-unit');
      var qty = qtyEl ? (Number(qtyEl.value)||null) : null;
      var unitKey = unitEl ? unitEl.value : null;
      decodeBarcodeFromDataUrl(state.barcodePhoto).then(function(code){
        return lookupOpenFoodFacts(code);
      }).then(function(info){
        var draft = applyKnownFoodOverride(offInfoToDraft(info), qty, unitKey);
        state.foodDraft = Object.assign({}, state.foodDraft, draft);
        state.foodAiLoading = false;
        render();
      }).catch(function(err){
        estimateFoodFromImage(state.barcodePhoto, true).then(function(result){
          result = applyKnownFoodOverride(result, qty, unitKey);
          state.foodDraft = Object.assign({}, state.foodDraft, result);
          state.foodAiLoading = false;
          state.foodAiError = ((err&&err.message)?err.message+' ':'')+'Odhad je teď z fotky pomocí AI — zkontroluj prosím hodnoty.';

    var barcodePhotoInput = document.getElementById('barcode-photo-input');

    var foodKcalInput = document.getElementById('food-kcal');

    if(foodKcalInput && foodKcalKjLabel) foodKcalInput.addEventListener('input', function(){
      var v = Number(foodKcalInput.value);
      foodKcalKjLabel.textContent = v>0 ? kcalToKj(v)+' kJ' : '';

    // Živé přepočítání kalorií/makro živin (a u nápojů i alkoholu), když se
    // po vyhledání z KalorickéTabulky.cz/NutriDatabáze/Open Food Facts změní
    // množství nebo jednotka. Přímo přepisuje hodnoty v polích (bez plného
    // render()), aby psaní čísla nebylo přerušované/neskákal kurzor.
    function recalcFoodMacrosFromPer100(){
      var draft = state.foodDraft;
      if(!draft || !draft.per100) return;
      var qtyEl = document.getElementById('food-qty');
      var unitEl = document.getElementById('food-unit');
      if(!qtyEl || !unitEl) return;
      var qty = Number(qtyEl.value);
      if(!qty || qty<=0) return;
      var unitKey = unitEl.value;
      var per100 = draft.per100;
      var factor = per100.rawQtyFactor ? (qty/100) : (gramsForQtyUnit(qty, unitKey)/100);
      var newKcal = Math.round((per100.kcal||0)*factor);
      var newProtein = Math.round((per100.protein||0)*factor*10)/10;
      var newCarbs = Math.round((per100.carbs||0)*factor*10)/10;
      var newFat = Math.round((per100.fat||0)*factor*10)/10;
      var updates = {kcal:newKcal, protein:newProtein, carbs:newCarbs, fat:newFat, quantity:qty, unit:unitKey};

      var kcalEl = document.getElementById('food-kcal');
      var proteinEl = document.getElementById('food-protein');
      var carbsEl = document.getElementById('food-carbs');
      var fatEl = document.getElementById('food-fat');
      var kjLabel = document.getElementById('food-kcal-kj');
      if(kcalEl) kcalEl.value = newKcal;
      if(proteinEl) proteinEl.value = newProtein;
      if(carbsEl) carbsEl.value = newCarbs;
      if(fatEl) fatEl.value = newFat;
      if(kjLabel) kjLabel.textContent = newKcal>0 ? kcalToKj(newKcal)+' kJ' : '';

      if(per100.alcohol100){
        var alcoholG = Math.round(qty*(per100.alcohol100/100)*0.79);
        updates.alcohol = alcoholG;
        updates.volumeMl = (alcoholG>0 && per100.isMl) ? Math.round(qty) : null;
        updates.abv = alcoholG>0 ? (Math.round(per100.alcohol100*10)/10) : 0;
        var alcEl = document.getElementById('food-alcohol');
        var alcVolEl = document.getElementById('food-alcohol-volume');
        var alcAbvEl = document.getElementById('food-alcohol-abv');
        if(alcEl) alcEl.value = alcoholG;
        if(alcVolEl && updates.volumeMl!=null) alcVolEl.value = updates.volumeMl;
        if(alcAbvEl) alcAbvEl.value = updates.abv;
      }

      state.foodDraft = Object.assign({}, draft, updates);
    }
    var foodQtyRecalcEl = document.getElementById('food-qty');
    var foodUnitRecalcEl = document.getElementById('food-unit');
    if(foodQtyRecalcEl) foodQtyRecalcEl.addEventListener('input', recalcFoodMacrosFromPer100);
    if(foodUnitRecalcEl) foodUnitRecalcEl.addEventListener('change', recalcFoodMacrosFromPer100);

    var foodSaveBtn = document.getElementById('food-save-btn');
    if(foodSaveBtn) foodSaveBtn.addEventListener('click', function(){
      var name = document.getElementById('food-name').value.trim();
      var ingredientsEl = document.getElementById('food-ingredients');
      var ingredients = ingredientsEl ? ingredientsEl.value.trim() : '';
      var kcal = Number(document.getElementById('food-kcal').value);
      var protein = Number(document.getElementById('food-protein').value)||0;
      var carbs = Number(document.getElementById('food-carbs').value)||0;
      var fat = Number(document.getElementById('food-fat').value)||0;
      var alcohol = Math.max(0, Number(document.getElementById('food-alcohol').value)||0);
      var alcVolEl = document.getElementById('food-alcohol-volume');
      var alcAbvEl = document.getElementById('food-alcohol-abv');
      var alcVolume = alcVolEl && alcVolEl.value ? Number(alcVolEl.value) : null;
      var alcAbv = alcAbvEl && alcAbvEl.value ? Number(alcAbvEl.value) : 0;
      var qty = Number(document.getElementById('food-qty').value) || 1;
      var unitKey = document.getElementById('food-unit').value;
      var timeEl = document.getElementById('food-time');
      var timeHM = timeEl ? timeEl.value : null;
      var mealType = state.addFoodMealType || guessMealType();
      var err = document.getElementById('food-error');
      err.innerHTML='';
      var msg='';
      if(!name) msg='Zadej název jídla.';
      else if(!kcal || kcal<=0 || kcal>5000) msg='Zadej platné kalorie (1–5000 kcal).';
      if(msg){ err.innerHTML='<div class="form-error">'+ICONS.alert+' '+msg+'</div>'; return; }
      var isEditing = !!state.editingFoodId;
      var day = isEditing ? (state.editingFoodDay || todayLocalISO()) : (state.selectedFoodDate || todayLocalISO());
      var timestamp = timeHM ? combineDayAndTime(day, timeHM) : buildEntryTimestamp(day);
      var fields = {name:name, ingredients:ingredients, kcal:Math.round(kcal), protein:Math.round(protein), carbs:Math.round(carbs), fat:Math.round(fat), alcohol:Math.round(alcohol), volumeMl:(alcohol && alcVolume)?Math.round(alcVolume):null, abv:(alcohol && alcAbv)?alcAbv:0, quantity:qty, unit:unitKey, mealType:mealType, time:timestamp};
      if(isEditing){
        updateFoodEntry(state.editingFoodId, day, fields, day);
      } else {
        persistFoodEntry(fields, day);
      }
      state.showAddFoodModal=false; state.foodDraft=null; state.foodPhoto=null; state.barcodePhoto=null;
      state.editingFoodId=null; state.editingFoodDay=null;
      render();
    });
