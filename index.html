  document.querySelectorAll('[data-day-type]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var day = btn.getAttribute('data-day-type-day');
      var val = btn.getAttribute('data-day-type');
      var dt = Object.assign({}, state.dayTypes);
      if(val==='normal') delete dt[day]; else dt[day] = val;
      saveDayTypes(dt);
      render();
    });
  });

  document.querySelectorAll('[data-cal-adjust]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var day = btn.getAttribute('data-cal-adjust-day');
      var val = btn.getAttribute('data-cal-adjust')==='yes';
      var ch = Object.assign({}, state.calAdjustChoices);
      ch[day] = val;
      saveCalAdjustChoices(ch);
      render();
    });
  });

  var foodDayPrev = document.getElementById('food-day-prev');
  if(foodDayPrev) foodDayPrev.addEventListener('click', function(){
    state.selectedFoodDate = addDaysISO(state.selectedFoodDate || todayLocalISO(), -1);
    render();
  });
  var foodDayNext = document.getElementById('food-day-next');
  if(foodDayNext) foodDayNext.addEventListener('click', function(){
    var current = state.selectedFoodDate || todayLocalISO();
    var next = addDaysISO(current, 1);
    if(next > todayLocalISO()) return;
    state.selectedFoodDate = next;
    render();
  });

  var aiSettingsBtn = document.getElementById('ai-settings-btn');
  if(aiSettingsBtn) aiSettingsBtn.addEventListener('click', function(){ state.showAiSettingsModal=true; render(); });

  var foodHistoryBtn = document.getElementById('food-history-btn');
  if(foodHistoryBtn) foodHistoryBtn.addEventListener('click', function(){ state.showFoodHistoryModal=true; render(); });

  var foodHistoryOverlay = document.getElementById('food-history-overlay');
  if(foodHistoryOverlay){
    foodHistoryOverlay.addEventListener('click', function(e){ if(e.target===foodHistoryOverlay){ state.showFoodHistoryModal=false; render(); } });
    var foodHistoryCloseBtn = document.getElementById('food-history-close-btn');
    if(foodHistoryCloseBtn) foodHistoryCloseBtn.addEventListener('click', function(){ state.showFoodHistoryModal=false; render(); });
  }

  document.querySelectorAll('[data-delete-food-id]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-delete-food-id');
      var day = btn.getAttribute('data-delete-food-day') || todayLocalISO();
      var list = (state.foodLog[day]||[]).filter(function(f){ return f.id!==id; });
      var log = Object.assign({}, state.foodLog);
      log[day] = list;
      saveFoodLog(log);
      render();
    });
  });

  var foodOverlay = document.getElementById('food-modal-overlay');
  if(foodOverlay){
    foodOverlay.addEventListener('click', function(e){ if(e.target===foodOverlay){ state.showAddFoodModal=false; state.foodDraft=null; state.foodPhoto=null; state.barcodePhoto=null; state.editingFoodId=null; state.editingFoodDay=null; render(); } });
    var foodCloseBtn = document.getElementById('food-modal-close-btn');
    if(foodCloseBtn) foodCloseBtn.addEventListener('click', function(){ state.showAddFoodModal=false; state.foodDraft=null; state.foodPhoto=null; state.barcodePhoto=null; state.editingFoodId=null; state.editingFoodDay=null; render(); });

    var mealTypeSeg = document.getElementById('meal-type-seg');
    if(mealTypeSeg) mealTypeSeg.querySelectorAll('.seg-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.addFoodMealType = btn.getAttribute('data-meal');
        render();
      });
    });

    var prepSeg = document.getElementById('food-prep-seg');
    if(prepSeg) prepSeg.querySelectorAll('.seg-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.foodDraft = Object.assign({}, state.foodDraft, {prepState: btn.getAttribute('data-prep')});
        render();
      });
    });

    var foodModeSeg = document.getElementById('food-mode-seg');
    if(foodModeSeg) foodModeSeg.querySelectorAll('.seg-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.foodInputMode = btn.getAttribute('data-mode');
        state.foodAiError='';
        state.alcoholAddedName='';
        render();
      });
    });

    var foodAiBtn = document.getElementById('food-ai-btn');
    if(foodAiBtn) foodAiBtn.addEventListener('click', function(){
      var description = document.getElementById('food-desc').value.trim();
      var qty = Number(document.getElementById('food-qty').value) || 1;
      var unitKey = document.getElementById('food-unit').value;
      var unit = unitByKey(unitKey);
      var prep = (state.foodDraft && state.foodDraft.prepState) || 'cooked';
      if(!description){ state.foodAiError='Napiš prosím, co jsi jedl(a).'; render(); return; }
      state.foodDraft = Object.assign({}, state.foodDraft, {description:description, quantity:qty, unit:unitKey, prepState:prep});
      state.foodAiLoading = true; state.foodAiError='';
      render();
      var combined = qty+' '+unit.phrase+' – '+description+(prep==='raw' ? ' (syrové, před tepelnou úpravou)' : ' (hotové/uvařené, po tepelné úpravě)');
      estimateFoodWithAi(combined).then(function(result){
        result = applyKnownFoodOverride(result, qty, unitKey);
        state.foodDraft = Object.assign({}, state.foodDraft, result, {description:description, quantity:qty, unit:unitKey, prepState:prep});
        state.foodAiLoading = false;
        render();
      }).catch(function(err){
        state.foodAiLoading = false;
        state.foodAiError = friendlyAiError(err);
        render();
      });
    });

    var foodAiNameBtn = document.getElementById('food-ai-name-btn');
    if(foodAiNameBtn) foodAiNameBtn.addEventListener('click', function(){
      var name = document.getElementById('food-name').value.trim();
      var qtyEl = document.getElementById('food-qty');
      var unitEl = document.getElementById('food-unit');
      var qty = qtyEl ? (Number(qtyEl.value) || 1) : 1;
      var unitKey = unitEl ? unitEl.value : 'porce';
      var unit = unitByKey(unitKey);
      var prep = (state.foodDraft && state.foodDraft.prepState) || 'cooked';
      if(!name){ state.foodAiError='Napiš prosím název jídla.'; render(); return; }
      state.foodDraft = Object.assign({}, state.foodDraft, {name:name, quantity:qty, unit:unitKey, prepState:prep});
      state.foodAiLoading = true; state.foodAiError='';
      render();
      var combined = qty+' '+unit.phrase+' – '+name+(prep==='raw' ? ' (syrové, před tepelnou úpravou)' : ' (hotové/uvařené, po tepelné úpravě)');
      estimateFoodWithAi(combined).then(function(result){
        result = applyKnownFoodOverride(result, qty, unitKey);
        state.foodDraft = Object.assign({}, state.foodDraft, result, {name:name, quantity:qty, unit:unitKey, prepState:prep});
        state.foodAiLoading = false;
        render();
      }).catch(function(err){
        state.foodAiLoading = false;
        state.foodAiError = friendlyAiError(err);
        render();
      });
    });

    var lookupSources = [
      {btnId:'food-lookup-kt-btn', source:'kalorickeTabulky', label:'Kalorických tabulek'},
      {btnId:'food-lookup-nd-btn', source:'nutriDatabaze', label:'NutriDatabáze'}
    ];
    lookupSources.forEach(function(cfg){
      var btn = document.getElementById(cfg.btnId);
      if(!btn) return;
      btn.addEventListener('click', function(){
        var nameEl = document.getElementById('food-name');
        var descEl = document.getElementById('food-desc');
        var query = ((nameEl && nameEl.value.trim()) || (descEl && descEl.value.trim()) || '').trim();
        if(!query){ state.foodLookupError='Napiš prosím název jídla.'; state.foodLookupNote=''; render(); return; }
        // zachovat rozepsané hodnoty ve state, ať je re-render (loading/chyba) nesmaže
        state.foodDraft = Object.assign({}, state.foodDraft, {
          description: descEl ? descEl.value : (state.foodDraft && state.foodDraft.description),
          name: nameEl && nameEl.value.trim() ? nameEl.value : (state.foodDraft && state.foodDraft.name)
        });
        state.foodLookupLoading = cfg.source;
        state.foodLookupError = '';
        state.foodLookupNote = '';
        render();
        lookupNutritionSource(cfg.source, query).then(function(result){
          state.foodDraft = Object.assign({}, state.foodDraft, {
            name: state.foodDraft && state.foodDraft.name ? state.foodDraft.name : query,
            kcal: result.kcal, protein: result.protein, carbs: result.carbs, fat: result.fat,
            knownFoodMatch:false
          });
          state.foodLookupLoading = null;
          state.foodLookupNote = result.source+': "'+result.matchedName+'" (hodnoty na 100 g – uprav podle skutečného množství)';
          render();
        }).catch(function(err){
          state.foodLookupLoading = null;
          state.foodLookupError = err.message || ('Vyhledávání přes '+cfg.label+' selhalo.');
          render();
        });
      });
    });

    var alcoholSearchInput = document.getElementById('alcohol-search');
    var alcoholSuggBox = document.getElementById('alcohol-search-suggestions');
    if(alcoholSearchInput && alcoholSuggBox){
      var alcDebounce = null;
      var alcReqToken = 0;
      var closeAlcSuggestions = function(){
        alcoholSuggBox.style.display='none';
        alcoholSuggBox.innerHTML='';
      };
      var fillAlcoholDraft = function(name, kcal, alcoholG, volumeMl, abv, estimated){
        state.foodDraft = Object.assign({}, state.foodDraft, {
          name:name, kcal:kcal, protein:0, carbs:0, fat:0,
          alcohol:alcoholG, volumeMl:volumeMl, abv:abv, alcoholEstimated:!!estimated
        });
        state.alcoholSearchQuery='';
        state.alcoholAddedName='';
        closeAlcSuggestions();
        render();
      };
      var renderAlcSuggestions = function(q, presetResults, aiState){
        var html='';
        presetResults.forEach(function(p){
          var idx = ALCOHOL_PRESETS.indexOf(p);
          html += '<div class="desc-suggestion-item" data-alc-preset-idx="'+idx+'">'+
            '<div class="desc-suggestion-name">'+esc(p.name)+'</div>'+
            '<div class="desc-suggestion-meta">'+p.volumeMl+' ml · '+p.abv+' %</div>'+
          '</div>';
        });
        if(aiState==='loading'){
          html += '<div class="desc-suggestion-loading"><span class="ai-spinner" style="width:11px;height:11px;margin-right:6px"></span>Hledám přes AI…</div>';
        } else if(aiState && aiState.result){
          var r = aiState.result;
          html += '<div class="desc-suggestion-item" data-alc-ai="1">'+
            '<div class="desc-suggestion-name">'+esc(r.name||q)+'</div>'+
            '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><span class="desc-suggestion-tag">AI odhad</span><span class="desc-suggestion-meta">'+Math.round(r.kcal||0)+' kcal</span></div>'+
          '</div>';
        } else if(aiState && aiState.error){
          html += '<div class="form-error" style="margin:6px 2px">'+ICONS.alert+' '+esc(aiState.error)+'</div>';
        } else if(!presetResults.length){
          html += '<div class="food-empty" style="padding:10px 10px 6px">Nic jsem nenašel v seznamu.</div>'+
            '<button type="button" class="btn-secondary" id="alcohol-ai-search-btn" style="width:100%;justify-content:center;margin:0 0 8px">'+ICONS.sparkle+' Najít přes AI / internet</button>';
        }
        if(!html){ closeAlcSuggestions(); return; }
        alcoholSuggBox.innerHTML = html;
        alcoholSuggBox.style.display='block';
        alcoholSuggBox.querySelectorAll('[data-alc-preset-idx]').forEach(function(el){
          el.addEventListener('mousedown', function(ev){ ev.preventDefault(); });
          el.addEventListener('click', function(){
            var idx = Number(el.getAttribute('data-alc-preset-idx'));
            var p = ALCOHOL_PRESETS[idx];
            if(!p) return;
            fillAlcoholDraft(p.name, p.kcal, alcoholPresetGrams(p), p.volumeMl, p.abv, false);
          });
        });
        var aiItem = alcoholSuggBox.querySelector('[data-alc-ai]');
        if(aiItem && aiState && aiState.result){
          aiItem.addEventListener('mousedown', function(ev){ ev.preventDefault(); });
          aiItem.addEventListener('click', function(){
            var r = aiState.result;
            fillAlcoholDraft(r.name||q, Math.round(r.kcal||0), Math.round(r.alcohol||0), r.volumeMl||null, r.abv||0, true);
          });
        }
        var aiBtn = document.getElementById('alcohol-ai-search-btn');
        if(aiBtn){
          aiBtn.addEventListener('mousedown', function(ev){ ev.preventDefault(); });
          aiBtn.addEventListener('click', function(){ runAlcoholAiSearch(q); });
        }
      };
      var runAlcoholAiSearch = function(q){
        if(!q) return;
        renderAlcSuggestions(q, alcoholPresetSearch(q), 'loading');
        var myToken = ++alcReqToken;
        estimateFoodWithAi(q, alcoholAiPrompt(q)).then(function(result){
          if(myToken!==alcReqToken) return;
          if(!result || !(Number(result.alcohol)>0)){
            renderAlcSuggestions(q, alcoholPresetSearch(q), {error:'AI se pro "'+q+'" nepodařilo odhadnout obsah alkoholu. Zkus upřesnit název (např. druh pálenky) nebo vyplň hodnoty ručně níže.'});
            return;
          }
          renderAlcSuggestions(q, alcoholPresetSearch(q), {result:result});
        }).catch(function(err){
          if(myToken!==alcReqToken) return;
          renderAlcSuggestions(q, alcoholPresetSearch(q), {error:friendlyAiError(err)});
        });
      };
      alcoholSearchInput.addEventListener('input', function(){
        var q = alcoholSearchInput.value;
        state.alcoholSearchQuery = q; // uloženo pro pozdější re-render, ale nevyvolává ho
        clearTimeout(alcDebounce);
        alcReqToken++; // zruší běžící AI dotaz z předchozího hledání
        var trimmed = q.trim();
        if(!trimmed){ closeAlcSuggestions(); return; }
        renderAlcSuggestions(trimmed, alcoholPresetSearch(trimmed), null);
      });
      alcoholSearchInput.addEventListener('blur', function(){
        setTimeout(closeAlcSuggestions, 180);
      });
      if((state.alcoholSearchQuery||'').trim()){
        renderAlcSuggestions(state.alcoholSearchQuery.trim(), alcoholPresetSearch(state.alcoholSearchQuery.trim()), null);
      }
    }
    document.querySelectorAll('[data-alc-quick-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = Number(btn.getAttribute('data-alc-quick-idx'));
        var p = ALCOHOL_PRESETS[idx];
        if(!p) return;
        var grams = alcoholPresetGrams(p);
        var day = state.selectedFoodDate || todayLocalISO();
        persistFoodEntry({name:p.name, kcal:p.kcal, protein:0, carbs:0, fat:0, alcohol:grams, volumeMl:p.volumeMl, abv:p.abv, quantity:1, unit:'porce', mealType: state.addFoodMealType || guessMealType()}, day);
        state.alcoholAddedName = p.name;
        render();
      });
    });

    var foodDescInput = document.getElementById('food-desc');
    var foodDescSuggBox = document.getElementById('food-desc-suggestions');
    if(foodDescInput && foodDescSuggBox){
      var descDebounce = null;
      var descReqToken = 0;
      var closeDescSuggestions = function(){
        foodDescSuggBox.style.display='none';
        foodDescSuggBox.innerHTML='';
      };
      var renderDescSuggestions = function(historyItems, offItems, loadingOff){
        var html = '';
        historyItems.forEach(function(item){
          html += '<div class="desc-suggestion-item" data-src="history" data-name="'+esc(item.name)+'" data-kcal="'+(item.kcal||0)+'" data-protein="'+(item.protein||0)+'" data-carbs="'+(item.carbs||0)+'" data-fat="'+(item.fat||0)+'" data-alcohol="'+(item.alcohol||0)+'" data-volume="'+(item.volumeMl!=null?item.volumeMl:'')+'" data-abv="'+(item.abv||'')+'">'+
            '<div class="desc-suggestion-name">'+esc(item.name)+'</div>'+
            '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><span class="desc-suggestion-tag">už jsi jedl(a)</span><span class="desc-suggestion-meta">'+Math.round(item.kcal||0)+' kcal</span></div>'+
          '</div>';
        });
        offItems.forEach(function(item){
          html += '<div class="desc-suggestion-item" data-src="off" data-name="'+esc(item.name)+'" data-kcal100="'+item.kcal100+'" data-protein100="'+item.protein100+'" data-carbs100="'+item.carbs100+'" data-fat100="'+item.fat100+'" data-alcohol100="'+(item.alcohol100||0)+'" data-qty="'+item.defaultQty+'" data-unit="'+item.defaultUnit+'">'+
            '<div class="desc-suggestion-name">'+esc(item.name)+'</div>'+
            '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><span class="desc-suggestion-tag">databáze</span><span class="desc-suggestion-meta">'+Math.round(item.kcal100)+' kcal/100'+(item.defaultUnit==='ml'?'ml':'g')+'</span></div>'+
          '</div>';
        });
        if(loadingOff){
          html += '<div class="desc-suggestion-loading"><span class="ai-spinner" style="width:11px;height:11px;margin-right:6px"></span>Hledám v databázi…</div>';
        }
        if(!html){ closeDescSuggestions(); return; }
        foodDescSuggBox.innerHTML = html;
        foodDescSuggBox.style.display='block';
        foodDescSuggBox.querySelectorAll('.desc-suggestion-item').forEach(function(el){
          el.addEventListener('mousedown', function(ev){ ev.preventDefault(); }); // keep focus so blur doesn't close before click
          el.addEventListener('click', function(){
            var src = el.getAttribute('data-src');
            var name = el.getAttribute('data-name');
            if(src==='history'){
              state.foodDraft = Object.assign({}, state.foodDraft, {
                description: name, name: name,
                kcal: Number(el.getAttribute('data-kcal'))||0,
                protein: Number(el.getAttribute('data-protein'))||0,
                carbs: Number(el.getAttribute('data-carbs'))||0,
                fat: Number(el.getAttribute('data-fat'))||0,
                alcohol: Number(el.getAttribute('data-alcohol'))||0,
                volumeMl: el.getAttribute('data-volume') ? Number(el.getAttribute('data-volume')) : null,
                abv: el.getAttribute('data-abv') ? Number(el.getAttribute('data-abv')) : 0,
                alcoholEstimated: false
              });
            } else {
              var qty = Number(document.getElementById('food-qty').value) || Number(el.getAttribute('data-qty')) || 100;
              var isMl = el.getAttribute('data-unit')==='ml';
              var factor = qty/100;
              var kcal100 = Number(el.getAttribute('data-kcal100'))||0;
              var protein100 = Number(el.getAttribute('data-protein100'))||0;
              var carbs100 = Number(el.getAttribute('data-carbs100'))||0;
              var fat100 = Number(el.getAttribute('data-fat100'))||0;
              var alcohol100 = Number(el.getAttribute('data-alcohol100'))||0;
              var alcoholG = alcohol100 ? Math.round(qty*(alcohol100/100)*0.79) : 0;
              state.foodDraft = Object.assign({}, state.foodDraft, {
                description: name, name: name,
                kcal: Math.round(kcal100*factor),
                protein: Math.round(protein100*factor),
                carbs: Math.round(carbs100*factor),
                fat: Math.round(fat100*factor),
                alcohol: alcoholG,
                volumeMl: (alcoholG>0 && isMl) ? Math.round(qty) : null,
                abv: alcoholG>0 ? (Math.round(alcohol100*10)/10) : 0,
                alcoholEstimated: false
              });
            }
            state.foodAiError='';
            render();
          });
        });
      };
      foodDescInput.addEventListener('input', function(){
        var q = foodDescInput.value.trim();
        clearTimeout(descDebounce);
        if(q.length<2){ closeDescSuggestions(); return; }
        var historyItems = getFoodHistorySuggestions(q);
        renderDescSuggestions(historyItems, [], false);
        var myToken = ++descReqToken;
        descDebounce = setTimeout(function(){
          renderDescSuggestions(historyItems, [], true);
          searchOpenFoodFactsText(q).then(function(offItems){
            if(myToken!==descReqToken) return;
            renderDescSuggestions(historyItems, offItems, false);
          }).catch(function(){
            if(myToken!==descReqToken) return;
            renderDescSuggestions(historyItems, [], false);
          });
        }, 400);
      });
      foodDescInput.addEventListener('blur', function(){
        setTimeout(closeDescSuggestions, 180);
      });
    }

    var foodPhotoTrigger = document.getElementById('food-photo-trigger');
    if(foodPhotoTrigger) foodPhotoTrigger.addEventListener('click', function(){
      document.getElementById('food-photo-input').click();
    });

    function runFoodPhotoAi(){
      if(!state.foodPhoto) return;
      state.foodAiLoading = true; state.foodAiError='';
      render();
      var qtyEl = document.getElementById('food-qty'), unitEl = document.getElementById('food-unit');
      var qty = qtyEl ? (Number(qtyEl.value)||null) : null;
      var unitKey = unitEl ? unitEl.value : null;
      decodeBarcodeFromDataUrl(state.foodPhoto).then(function(code){
        return lookupOpenFoodFacts(code);
      }).then(function(info){
        var draft = applyKnownFoodOverride(offInfoToDraft(info), qty, unitKey);
        state.foodDraft = Object.assign({}, state.foodDraft, draft);
        state.foodAiLoading = false;
        state.foodAiError = '';
        render();
      }).catch(function(){
        // na fotce nešel najít/rozpoznat čárový kód, nebo produkt není v databázi — odhadneme z fotky pomocí AI
        estimateFoodFromImage(state.foodPhoto, false).then(function(result){
          result = applyKnownFoodOverride(result, qty, unitKey);
          state.foodDraft = Object.assign({}, state.foodDraft, result);
          state.foodAiLoading = false;
          render();
        }).catch(function(err){
          state.foodAiLoading = false;
          state.foodAiError = friendlyAiError(err);
          render();
        });
      });
    }

    var foodPhotoInput = document.getElementById('food-photo-input');
    if(foodPhotoInput) foodPhotoInput.addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        state.foodPhoto = ev.target.result;
        state.foodAiError='';
        runFoodPhotoAi();
      };
      reader.readAsDataURL(file);
    });
    var foodPhotoAiBtn = document.getElementById('food-photo-ai-btn');
    if(foodPhotoAiBtn) foodPhotoAiBtn.addEventListener('click', runFoodPhotoAi);

    var barcodePhotoTrigger = document.getElementById('barcode-photo-trigger');
    if(barcodePhotoTrigger) barcodePhotoTrigger.addEventListener('click', function(){
      document.getElementById('barcode-photo-input').click();
    });

    function runBarcodeScan(){
      if(!state.barcodePhoto) return;
      state.foodAiLoading = true; state.foodAiError='';
      render();
      var qtyEl = document.getElementById('food-qty'), unitEl = document.getElementById('food-unit');
      var qty = qtyEl ? (Number(qtyEl.value)||null) : null;
      var unitKey = unitEl ? unitEl.value : null;
      decodeBarcodeFromDataUrl(state.barcodePhoto).then(function(code){
        return lookupOpenFoodFacts(code);
      }).then(function(info){
        var draft = applyKnownFoodOverride(offInfoToDraft(info), qty, unitKey);
        state.foodDraft = Object.assign({}, state.foodDraft, draft);
        state.foodAiLoading = false;
        render();
      }).catch(function(err){
        estimateFoodFromImage(state.barcodePhoto, true).then(function(result){
          result = applyKnownFoodOverride(result, qty, unitKey);
          state.foodDraft = Object.assign({}, state.foodDraft, result);
          state.foodAiLoading = false;
          state.foodAiError = ((err&&err.message)?err.message+' ':'')+'Odhad je teď z fotky pomocí AI — zkontroluj prosím hodnoty.';
          render();
        }).catch(function(err2){
          state.foodAiLoading = false;
          state.foodAiError = friendlyAiError(err2);
          render();
        });
      });
    }

    var barcodePhotoInput = document.getElementById('barcode-photo-input');
    if(barcodePhotoInput) barcodePhotoInput.addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        state.barcodePhoto = ev.target.result;
        state.foodAiError='';
        runBarcodeScan();
      };
      reader.readAsDataURL(file);
    });
    var barcodeScanBtn = document.getElementById('barcode-scan-btn');
    if(barcodeScanBtn) barcodeScanBtn.addEventListener('click', runBarcodeScan);

    var foodKcalInput = document.getElementById('food-kcal');
    var foodKcalKjLabel = document.getElementById('food-kcal-kj');
    if(foodKcalInput && foodKcalKjLabel) foodKcalInput.addEventListener('input', function(){
      var v = Number(foodKcalInput.value);
      foodKcalKjLabel.textContent = v>0 ? kcalToKj(v)+' kJ' : '';
    });

    var foodSaveBtn = document.getElementById('food-save-btn');
    if(foodSaveBtn) foodSaveBtn.addEventListener('click', function(){
      var name = document.getElementById('food-name').value.trim();
      var ingredientsEl = document.getElementById('food-ingredients');
      var ingredients = ingredientsEl ? ingredientsEl.value.trim() : '';
      var kcal = Number(document.getElementById('food-kcal').value);
      var protein = Number(document.getElementById('food-protein').value)||0;
      var carbs = Number(document.getElementById('food-carbs').value)||0;
      var fat = Number(document.getElementById('food-fat').value)||0;
      var alcohol = Math.max(0, Number(document.getElementById('food-alcohol').value)||0);
      var alcVolEl = document.getElementById('food-alcohol-volume');
      var alcAbvEl = document.getElementById('food-alcohol-abv');
      var alcVolume = alcVolEl && alcVolEl.value ? Number(alcVolEl.value) : null;
      var alcAbv = alcAbvEl && alcAbvEl.value ? Number(alcAbvEl.value) : 0;
      var qty = Number(document.getElementById('food-qty').value) || 1;
      var unitKey = document.getElementById('food-unit').value;
      var timeEl = document.getElementById('food-time');
      var timeHM = timeEl ? timeEl.value : null;
      var mealType = state.addFoodMealType || guessMealType();
      var err = document.getElementById('food-error');
      err.innerHTML='';
      var msg='';
      if(!name) msg='Zadej název jídla.';
      else if(!kcal || kcal<=0 || kcal>5000) msg='Zadej platné kalorie (1–5000 kcal).';
      if(msg){ err.innerHTML='<div class="form-error">'+ICONS.alert+' '+msg+'</div>'; return; }
      var isEditing = !!state.editingFoodId;
      var day = isEditing ? (state.editingFoodDay || todayLocalISO()) : (state.selectedFoodDate || todayLocalISO());
      var timestamp = timeHM ? combineDayAndTime(day, timeHM) : buildEntryTimestamp(day);
      var fields = {name:name, ingredients:ingredients, kcal:Math.round(kcal), protein:Math.round(protein), carbs:Math.round(carbs), fat:Math.round(fat), alcohol:Math.round(alcohol), volumeMl:(alcohol && alcVolume)?Math.round(alcVolume):null, abv:(alcohol && alcAbv)?alcAbv:0, quantity:qty, unit:unitKey, mealType:mealType, time:timestamp};
      if(isEditing){
        updateFoodEntry(state.editingFoodId, day, fields, day);
      } else {
        persistFoodEntry(fields, day);
      }
      state.showAddFoodModal=false; state.foodDraft=null; state.foodPhoto=null; state.barcodePhoto=null;
      state.editingFoodId=null; state.editingFoodDay=null;
      render();
    });
  }

  var aiSettingsOverlay = document.getElementById('ai-settings-overlay');
  if(aiSettingsOverlay){
    aiSettingsOverlay.addEventListener('click', function(e){ if(e.target===aiSettingsOverlay){ state.showAiSettingsModal=false; render(); } });
    var aiSettingsCloseBtn = document.getElementById('ai-settings-close-btn');
    if(aiSettingsCloseBtn) aiSettingsCloseBtn.addEventListener('click', function(){ state.showAiSettingsModal=false; render(); });

    var aiKeysSaveBtn = document.getElementById('ai-keys-save-btn');
    if(aiKeysSaveBtn) aiKeysSaveBtn.addEventListener('click', function(){

        groq: document.getElementById('ai-key-groq').value.trim(),

    var weight = Number(document.getElementById('entry-weight').value);
    var err = document.getElementById('entry-error');
    err.innerHTML='';
    var msg='';
    if(!date) msg='Zadej datum.';
    else if(!weight || weight<20 || weight>300) msg='Zadej platnou váhu v kg (20–300).';
    if(msg){ err.innerHTML='<div class="form-error">'+ICONS.alert+' '+msg+'</div>'; return; }

  document.querySelectorAll('[data-delete-id]').forEach(function(btn){

  var overlay = document.getElementById('modal-overlay');

    var closeBtn = document.getElementById('modal-close-btn');

    var epSexSeg = document.getElementById('ep-sex-seg');
    if(epSexSeg) epSexSeg.querySelectorAll('.seg-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        epSexSeg.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('ep-sex').value = btn.getAttribute('data-val');
      });
    });

    function wireEpPaceSeg(){
      var seg = document.getElementById('ep-pace-seg');
      if(!seg) return;
      seg.querySelectorAll('.seg-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          seg.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          var val = btn.getAttribute('data-val');
          document.getElementById('ep-pace').value = val;
          var goalKey = document.getElementById('ep-goal').value;
          var tipEl = document.getElementById('ep-pace-tip');
          if(tipEl) tipEl.textContent = paceByKey(goalKey, val).tip;
        });
      });
    }
    wireEpPaceSeg();

    var epGoalSel = document.getElementById('ep-goal');
    epGoalSel.addEventListener('change', function(){
      document.getElementById('ep-pace-wrap').innerHTML = paceOptionsHtml(this.value, 'normal', 'ep');
      wireEpPaceSeg();
    });

    var epForm = document.getElementById('edit-profile-form');
    epForm.addEventListener('submit', function(e){
      e.preventDefault();
      var name = document.getElementById('ep-name').value.trim();
      var age = Number(document.getElementById('ep-age').value);
      var height = Number(document.getElementById('ep-height').value);
      var sex = document.getElementById('ep-sex').value;
      var goal = document.getElementById('ep-goal').value;
      var activity = document.getElementById('ep-activity').value;
      var epPaceInput = document.getElementById('ep-pace');
      var pace = epPaceInput ? epPaceInput.value : 'normal';
      var targetWeightRaw = document.getElementById('ep-target-weight').value;
      var targetWeight = targetWeightRaw ? Number(targetWeightRaw) : null;
      var err = document.getElementById('ep-error');
      err.innerHTML='';
      var msg='';
      if(!name) msg='Zadej prosím jméno.';
      else if(!age || age<1 || age>120) msg='Zadej platný věk.';
      else if(!height || height<100 || height>250) msg='Zadej výšku v centimetrech (100–250).';
      else if(targetWeight!==null && (targetWeight<20 || targetWeight>300)) msg='Zadej reálnou cílovou váhu v kilogramech (20–300).';
      if(msg){ err.innerHTML='<div class="form-error">'+ICONS.alert+' '+msg+'</div>'; return; }
      saveProfile({name:name, age:age, height:height, sex:sex, goal:goal, activity:activity, pace:pace, targetWeight:targetWeight});
      state.editingProfile=false;
      render();
    });

    var resetStart = document.getElementById('reset-start-btn');
    if(resetStart) resetStart.addEventListener('click', function(){ state.confirmReset=true; render(); });
    var resetCancel = document.getElementById('reset-cancel-btn');
    if(resetCancel) resetCancel.addEventListener('click', function(){ state.confirmReset=false; render(); });
    var resetConfirm = document.getElementById('reset-confirm-btn');
    if(resetConfirm) resetConfirm.addEventListener('click', function(){
      localStorage.removeItem('bmi_profile');
      localStorage.removeItem('bmi_entries');
      state.profile=null; state.entries=[]; state.editingProfile=false; state.confirmReset=false;
      render();
    });
  }

  var exOverlay = document.getElementById('exercise-overlay');
  if(exOverlay){
    exOverlay.addEventListener('click', function(e){ if(e.target===exOverlay){ state.showExerciseModal=false; state.exerciseDetail=null; render(); } });
    var exCloseBtn = document.getElementById('exercise-close-btn');
    if(exCloseBtn) exCloseBtn.addEventListener('click', function(){ state.showExerciseModal=false; state.exerciseDetail=null; render(); });
    var exBackBtn = document.getElementById('exercise-back-btn');
    if(exBackBtn) exBackBtn.addEventListener('click', function(){ state.exerciseDetail=null; render(); });
    document.querySelectorAll('.tab-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.exerciseTab = btn.getAttribute('data-tab');
        render();
      });
    });
    document.querySelectorAll('.exercise-item').forEach(function(item){
      function open(){
        state.exerciseDetail = { tab:item.getAttribute('data-tab'), idx:Number(item.getAttribute('data-idx')) };
        render();
      }
      item.addEventListener('click', open);
      item.addEventListener('keydown', function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); open(); } });
    });
  }
}

// ---------- matrix rain ----------
var matrixRainHandle = null;
function initMatrixRain(){
  var canvas = document.getElementById('matrix-rain');
  if(!canvas) return;
  if(matrixRainHandle){ clearInterval(matrixRainHandle); matrixRainHandle = null; }
  var ctx = canvas.getContext('2d');
  var fontSize = 8;
  var chars = 'アイウエオカキクケコサシスセソ0123456789ABCDEFGHIJK';
  var columns = Math.floor(canvas.width / fontSize);
  var drops = [];
  for(var i=0;i<columns;i++){ drops[i] = Math.random()*canvas.height/fontSize; }
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  matrixRainHandle = setInterval(function(){
    if(!document.body.contains(canvas)){ clearInterval(matrixRainHandle); matrixRainHandle = null; return; }
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#3ddc84';
    ctx.font = fontSize+'px monospace';
    for(var j=0;j<drops.length;j++){
      var ch = chars.charAt(Math.floor(Math.random()*chars.length));
      ctx.fillText(ch, j*fontSize, drops[j]*fontSize);
      if(drops[j]*fontSize > canvas.height && Math.random() > 0.95){ drops[j] = 0; }
      drops[j]++;
    }
  }, 90);
}
// ---------- init ----------
function tickLiveWidgets(){
  var clockEl = document.getElementById('live-clock');
  if(clockEl) clockEl.textContent = formatTimeHMS(new Date());

  var bacValueEl = document.getElementById('bac-value');
  if(bacValueEl && state.profile){
    var alc = computeAlcoholStatus();
    var alcColor = alc.promile>0 ? (alc.promile>=1 ? COLORS.obese : COLORS.over) : COLORS.normal;
    bacValueEl.textContent = alc.promile.toFixed(2).replace('.', ',');
    bacValueEl.style.color = alcColor;
    var soberEl = document.getElementById('bac-sober-time');
    var labelEl = document.getElementById('bac-status-note');
    var headerLabelEl = soberEl && soberEl.previousElementSibling;
    if(soberEl) soberEl.textContent = alc.soberAt ? formatTimeHM(alc.soberAt) : '—';
    if(labelEl) labelEl.textContent = alc.soberAt ? 'orientační čas' : 'nemáš v krvi alkohol';
    if(headerLabelEl) headerLabelEl.textContent = alc.soberAt ? 'Střízlivý(á) od' : 'Stav';
  }
}
setInterval(tickLiveWidgets, 1000);

loadState();
render();
</script>
