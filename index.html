<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinator Vitals — BMI a sledování váhy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
  :root{
    --bg:#0A0F0D; --bg-2:#0E1512; --surface:#131B18; --surface-2:#1B2521; --ink:#EDF5F1; --ink-muted:#8CA69C; --line:#243029;
    --accent:#3EE29A; --accent-2:#28B4E0; --accent-soft:rgba(62,226,154,0.14);
    --under:#5AA6E8; --under-soft:rgba(90,166,232,0.14);
    --normal:#3EE29A; --normal-soft:rgba(62,226,154,0.14);
    --over:#F0B84A; --over-soft:rgba(240,184,74,0.14);
    --obese:#F0725E; --obese-soft:rgba(240,114,94,0.14);
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 12% 0%, rgba(62,226,154,0.08) 0%, transparent 45%),
      radial-gradient(circle at 90% 8%, rgba(40,180,224,0.07) 0%, transparent 40%),
      radial-gradient(circle at 1px 1px, rgba(237,245,241,0.035) 1px, transparent 0);
    background-size: auto, auto, 22px 22px;
    min-height:100vh; font-family:'Inter',sans-serif; color:var(--ink);
    padding:24px 16px 60px;
  }
  .page,.onboard{max-width:560px;margin:0 auto;}
  .eyebrow{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--accent);font-weight:500;}
  .header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
  .hello{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin:2px 0 0;}
  .card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow);}
  .card-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;margin-bottom:14px;}
  .gauge-card{text-align:center;}
  .gauge-wrap{position:relative;max-width:300px;margin:0 auto;}
  .gauge-svg{width:100%;height:auto;display:block;}
  .gauge-readout{position:absolute;left:0;right:0;bottom:10px;text-align:center;}
  .bmi-number{font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
  .bmi-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--ink-muted);margin-top:2px;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;font-size:13px;font-weight:600;margin:8px 0 14px;}
  .pill-dot{width:7px;height:7px;border-radius:50%;}
  .advice{font-size:14px;line-height:1.55;text-align:left;margin:0 0 10px;}
  .advice-note{font-size:13px;line-height:1.5;color:var(--ink-muted);text-align:left;margin:0;}
  .advice-note strong{color:var(--ink);}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .stat-card{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px 12px;}
  .stat-label{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);margin-bottom:6px;}
  .stat-value{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px;}
  .stat-value span{font-size:12px;font-weight:500;color:var(--ink-muted);}
  .stat-sub{font-size:11px;color:var(--ink-muted);margin-top:4px;}
  .entry-form{display:flex;gap:10px;align-items:end;flex-wrap:wrap;}
  .entry-form .field{flex:1;min-width:120px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .field-desc-wrap{position:relative;}
  .desc-suggestions{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35);max-height:260px;overflow-y:auto;}
  .desc-suggestion-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);}
  .desc-suggestion-item:last-child{border-bottom:none;}
  .desc-suggestion-item:hover,.desc-suggestion-item:active{background:var(--bg-2);}
  .desc-suggestion-name{font-size:13px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .desc-suggestion-meta{font-size:11px;color:var(--ink-muted);flex-shrink:0;}
  .desc-suggestion-tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-muted);flex-shrink:0;padding:2px 6px;border:1px solid var(--line);border-radius:6px;}
  .desc-suggestion-loading{padding:10px 12px;font-size:12px;color:var(--ink-muted);}
  .alc-preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
  .alc-preset-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .alc-preset-name{font-size:12.5px;font-weight:600;}
  .alc-preset-meta{font-size:10.5px;color:var(--ink-muted);}
  .alc-preset-add{width:100%;background:var(--accent-soft,rgba(62,226,154,0.14));color:var(--accent);border:none;border-radius:9px;padding:6px 0;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;}
  .alc-preset-add:active{opacity:.75;}
  .alc-added-toast{font-size:12px;color:var(--accent);text-align:center;padding:6px 0;}
  .field span{font-size:12px;font-weight:600;color:var(--ink-muted);}
  .field-row{display:flex;gap:10px;flex-wrap:wrap;}
  .field-row .field{flex:1;}
  .input{border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);background:var(--bg-2);outline:none;transition:border-color .15s,background .15s;width:100%;}
  .input:focus{border-color:var(--accent);background:var(--surface-2);}
  select.input{appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%238CA69C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>');background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;}
  .seg{display:flex;gap:8px;}
  .seg-btn{flex:1;border:1px solid var(--line);background:var(--bg-2);color:var(--ink-muted);border-radius:12px;padding:10px 8px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;text-align:center;}
  .seg-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06231A;border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s;white-space:nowrap;}
  .btn-primary:hover{opacity:.92;}
  .btn-primary:active{transform:scale(.97);}
  .btn-icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;transition:background .15s;}
  .btn-icon:hover{background:var(--accent-soft);}
  .btn-icon.subtle{border:none;background:transparent;color:var(--ink-muted);}
  .btn-icon.subtle:hover{background:var(--obese-soft);color:var(--obese);}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-ghost-danger{background:none;border:1px solid var(--obese);color:var(--obese);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-ghost-danger:hover{background:var(--obese-soft);}
  .form-error{display:flex;align-items:center;gap:6px;color:var(--obese);font-size:12.5px;margin:4px 0 10px;}
  .error-banner{display:flex;align-items:center;gap:8px;background:var(--obese-soft);color:var(--obese);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px;}
  .chart-wrap{margin-top:-6px;}
  .chart-legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted);margin-top:4px;}
  .legend-swatch{width:12px;height:12px;border-radius:4px;display:inline-block;background:var(--accent-soft);}
  .empty-state{font-size:13px;color:var(--ink-muted);padding:20px 0;text-align:center;}
  .history-list{display:flex;flex-direction:column;gap:2px;max-height:320px;overflow-y:auto;}
  .history-item{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);}
  .history-item:last-child{border-bottom:none;}
  .history-weight{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;}
  .history-date{font-size:12px;color:var(--ink-muted);margin-top:1px;}
  .footer-note{font-size:12px;color:var(--ink-muted);text-align:center;margin-top:22px;line-height:1.5;}
  .onboard{padding-top:40px;}
  .onboard-title{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;margin:6px 0 8px;line-height:1.1;}
  .onboard-title span{color:var(--accent);}
  .onboard-sub{color:var(--ink-muted);font-size:14px;margin-bottom:22px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(4,8,7,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;backdrop-filter:blur(3px);overflow-y:auto;}
  .modal{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:calc(100dvh - 40px);overflow-y:auto;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .danger-zone{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .confirm-row{display:flex;flex-direction:column;gap:8px;font-size:13px;}
  .confirm-row .row-btns{display:flex;gap:8px;}
  .fade-up{animation:fadeUp .5s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (max-width:420px){
    .stat-grid{grid-template-columns:1fr 1fr;}
    .stat-grid .stat-card:last-child{grid-column:span 2;}
    .bmi-number{font-size:32px;}
    .onboard-title{font-size:28px;}
  }

  .exercise-teaser{display:flex;align-items:center;gap:14px;}
  .exercise-teaser-icon{
    width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .exercise-teaser-text{flex:1;}
  .exercise-teaser-text .card-title{margin-bottom:2px;}
  .exercise-teaser-text p{font-size:13px;color:var(--ink-muted);margin:0;line-height:1.4;display:flex;align-items:center;}
  .bmi-teaser{display:flex;align-items:center;gap:14px;}
  .bmi-teaser-icon{
    width:44px;height:44px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;
  }
  .btn-secondary{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
    background:var(--accent-soft);color:var(--accent);border:1px solid rgba(62,226,154,.25);border-radius:12px;
    padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:opacity .15s;
  }
  .btn-secondary:hover{opacity:.85;}
  .btn-secondary:disabled,.btn-primary:disabled{opacity:.6;cursor:not-allowed;}

  .modal-lg{max-width:460px;max-height:85vh;display:flex;flex-direction:column;padding:0;overflow:hidden;}
  .modal-lg .modal-header{padding:20px 20px 14px;margin-bottom:0;border-bottom:1px solid var(--line);}
  .modal-lg-body{padding:16px 20px 22px;overflow-y:auto;}

  .tab-row{display:flex;gap:8px;padding:14px 20px 0;}
  .tab-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--bg-2);border:1px solid var(--line);color:var(--ink-muted);
    border-radius:12px;padding:10px 8px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;transition:background .15s,color .15s,border-color .15s;
  }
  .tab-btn.active{background:var(--accent);border-color:var(--accent);color:#06231A;}

  .exercise-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .exercise-item{border:1px solid var(--line);border-radius:14px;padding:13px 14px;}
  .exercise-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
  .exercise-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;}
  .exercise-badges{display:flex;gap:5px;flex-shrink:0;}
  .eq-badge{
    display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;
    padding:3px 8px;border-radius:100px;font-family:'JetBrains Mono',monospace;white-space:nowrap;
  }
  .eq-badge.bodyweight{background:var(--normal-soft);color:var(--normal);}
  .eq-badge.dumbbell{background:var(--under-soft);color:var(--under);}
  .exercise-meta{font-size:12px;color:var(--ink-muted);margin-bottom:5px;font-family:'JetBrains Mono',monospace;}
  .exercise-tip{font-size:13px;line-height:1.5;color:var(--ink);margin:0;}
  .exercise-group-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-family:'JetBrains Mono',monospace;margin:16px 0 2px;}
  .exercise-group-label:first-child{margin-top:0;}

  .exercise-item{cursor:pointer;transition:border-color .15s,background .15s;}
  .exercise-item:hover, .exercise-item:focus{border-color:var(--accent);background:var(--accent-soft);outline:none;}
  .exercise-open-hint{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--accent);font-weight:600;margin-top:8px;}

  .modal-header{position:relative;display:flex;align-items:center;}
  .figure-card{
    background:var(--bg);border:1px solid var(--line);border-radius:16px;
    max-width:220px;margin:0 auto 14px;padding:10px;
  }
  .figure-svg{width:100%;height:auto;display:block;}
  .detail-section-label{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;margin:0 0 10px;}
  .steps-list{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px;}
  .steps-list li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.5;}
  .step-num{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;
    font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .tip-callout{
    background:var(--over-soft);color:var(--ink);border-radius:12px;padding:12px 14px;
    font-size:13px;line-height:1.5;margin-bottom:14px;
  }
  .tip-callout strong{color:var(--over);}
  .video-link{width:100%;text-decoration:none;box-sizing:border-box;}

  .cal-hero{text-align:center;}
  .cal-hero-num{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .cal-hero-unit{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;color:var(--ink-muted);margin-top:2px;}
  .cal-sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px;}
  .cal-sub-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:center;}
  .cal-sub-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);margin-bottom:4px;}
  .cal-sub-value{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;}
  .macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
  .macro-card{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;}
  .macro-name{font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:10px;}
  .macro-ring{width:68px;height:68px;border-radius:50%;margin:0 auto 8px;position:relative;display:flex;align-items:center;justify-content:center;}
  .macro-ring-inner{position:absolute;inset:6px;background:var(--surface-2);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;}
  .macro-pct{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;}
  .macro-grams{font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:700;}
  .macro-unit{font-size:10.5px;color:var(--ink-muted);margin-top:1px;}
  .goal-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;font-size:12.5px;font-weight:600;margin-bottom:14px;}
  .cal-note{font-size:12.5px;line-height:1.55;color:var(--ink-muted);text-align:left;margin:14px 0 0;}
  .cal-note strong{color:var(--ink);}
  .cal-warning{display:flex;align-items:flex-start;gap:8px;background:var(--over-soft);color:var(--over);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-top:12px;text-align:left;}
  .field-3{display:flex;gap:10px;}
  .field-3 .field{flex:1;min-width:0;}
  .pace-tip{display:block;font-size:12px;line-height:1.5;color:var(--ink-muted);margin-top:8px;}
  .goal-progress-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;}
  .goal-progress-track{width:100%;height:10px;border-radius:100px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;}
  .goal-progress-fill{height:100%;border-radius:100px;transition:width .3s ease;}

  .food-hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .food-remaining-num{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
  .food-remaining-unit{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--ink-muted);margin-top:2px;}
  .food-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px;}
  .food-mini-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;}
  .food-mini-label{font-size:11px;color:var(--ink-muted);margin-bottom:6px;}
  .food-mini-track{width:100%;height:6px;border-radius:100px;background:var(--bg-2);overflow:hidden;margin:6px 0;}
  .food-mini-fill{height:100%;border-radius:100px;}
  .food-mini-value{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;}
  .mini-donut{width:58px;height:58px;border-radius:50%;margin:6px auto 8px;position:relative;}
  .mini-donut-overflow{position:absolute;inset:-6px;border-radius:50%;}
  .mini-donut-main{position:absolute;inset:0;border-radius:50%;}
  .mini-donut-hole{position:absolute;inset:8px;background:var(--surface-2);border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .mini-donut-pct{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
  .food-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .food-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;}
  .food-item-name{font-size:13.5px;font-weight:600;}
  .food-item-macro{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
  .food-item-kcal{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;white-space:nowrap;}
  .food-item-kj{font-size:10px;color:var(--ink-muted);white-space:nowrap;margin-top:1px;}
  .food-empty{font-size:13px;color:var(--ink-muted);text-align:center;padding:14px 4px;}
  .meal-groups{margin-top:14px;display:flex;flex-direction:column;gap:2px;}

  @media (max-width:420px){

    .macro-ring{width:58px;height:58px;}

function alcoholPresetGrams(p){ return Math.max(0, Math.round(p.volumeMl*(p.abv/100)*0.79)); }
function foldDiacritics(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function alcoholPresetSearch(query){
  var q = foldDiacritics(query).trim();
  if(!q) return [];
  return ALCOHOL_PRESETS.filter(function(p){ return foldDiacritics(p.name).indexOf(q)>=0; }).slice(0,8);
}

function calcDayTypePlan(plan, dayType){
  if(dayType==='refeed'){
    var t = Math.max(plan.target, Math.round(plan.tdee));
    var proteinG = plan.proteinG;
    var fatG = plan.fatG;
    var carbCal = Math.max(0, t - proteinG*4 - fatG*9);
    var carbG = Math.round(carbCal/4);
    return {target:t, proteinG:proteinG, fatG:fatG, carbG:carbG};
  }
  if(dayType==='cheat'){
    var t2 = Math.max(plan.target, Math.round(plan.tdee*1.3));
    var proteinG2 = plan.proteinG;
    var fatCal2 = t2*(plan.fatPct||28)/100;
    var fatG2 = Math.round(fatCal2/9);
    var carbCal2 = Math.max(0, t2-proteinG2*4-fatCal2);
    var carbG2 = Math.round(carbCal2/4);
    return {target:t2, proteinG:proteinG2, fatG:fatG2, carbG:carbG2};
  }
  return {target:plan.target, proteinG:plan.proteinG, fatG:plan.fatG, carbG:plan.carbG};
}

var ALCOHOL_ELIMINATION_PER_HOUR = 0.15; // ‰ za hodinu, průměrná hodnota
function alcoholWidmarkR(sex){ return sex==='female' ? 0.55 : 0.68; }
function computeAlcoholStatus(){
  var profile = state.profile;
  if(!profile) return {promile:0, drinksActive:false, soberAt:null, drinks:[]};
  var asc = sortedAsc(state.entries||[]);
  var weight = asc.length ? asc[asc.length-1].weight : null;
  if(!weight) return {promile:0, drinksActive:false, soberAt:null, drinks:[]};
  var r = alcoholWidmarkR(profile.sex);
  var now = Date.now();
  var total = 0;
  var anyEverContributed = false;
  var drinks = [];
  Object.keys(state.foodLog||{}).forEach(function(day){
    (state.foodLog[day]||[]).forEach(function(f){
      if(!f.alcohol || !f.time) return;
      var t0 = new Date(f.time).getTime();
      if(!isFinite(t0)) return;
      var hoursSince = (now - t0)/3600000;
      if(hoursSince < -0.05) return; // budoucí záznam, ignorovat
      if(hoursSince < 0) hoursSince = 0;
      var peak = f.alcohol / (r * weight);
      if(peak > 0) anyEverContributed = true;
      var current = peak - ALCOHOL_ELIMINATION_PER_HOUR*hoursSince;
      if(current > 0){
        total += current;
        drinks.push({id:f.id, name:f.name||'Nápoj', time:f.time, day:day, alcohol:f.alcohol, volumeMl:f.volumeMl, abv:f.abv, current:current, peak:peak});
      }
    });
  });
  drinks.sort(function(a,b){ return new Date(b.time)-new Date(a.time); });
  total = Math.round(total*100)/100;
  var soberAt = null;
  if(total > 0){
    var hoursLeft = total / ALCOHOL_ELIMINATION_PER_HOUR;
    soberAt = new Date(now + hoursLeft*3600000);
  }
  return {promile: total, drinksActive: total>0, soberAt: soberAt, everHadAlcohol: anyEverContributed, drinks: drinks};
}

  var pctRaw;
  if(Math.abs(totalSpan) < 0.05) pctRaw = 100;

function retryOn429(fn, retries, delayMs){

function tryParseLenientJson(raw){
  try{ return JSON.parse(raw); }catch(e){}

  // vytáhneme jednotlivá pole regexem, tolerantně vůči textu navíc kolem čísel.

    var m = raw.match(new RegExp('"'+key+'"\\s*:\\s*(-?[0-9]+(?:[.,][0-9]+)?)'));
    return m ? Number(m[1].replace(',','.')) : undefined;
  }

  obj.protein = numField('protein');
  obj.carbs = numField('carbs');
  obj.fat = numField('fat');
  obj.alcohol = numField('alcohol');
  obj.volumeMl = numField('volumeMl');
  obj.abv = numField('abv');

  var kcal = Number(obj.kcal);
  if(!isFinite(kcal) || kcal<0) throw new Error('AI vrátila neplatná data.');
  var alcohol = Math.max(0, Math.round(Number(obj.alcohol)||0));
  var volumeMl = Number(obj.volumeMl);
  var abv = Number(obj.abv);
  var nameStr = obj.name ? String(obj.name) : '';
  if(alcohol>0 && isFinite(abv) && abv>0){
    var degMatch = nameStr.match(/(\d{1,2}(?:[.,]\d)?)\s*°/);
    var hasExplicitPct = /\d{1,2}(?:[.,]\d)?\s*%/.test(nameStr);
    if(degMatch && !hasExplicitPct){
      var deg = parseFloat(degMatch[1].replace(',','.'));

// ---------- barcode reading (native BarcodeDetector + ZXing fallback + Open Food Facts lookup) ----------
function decodeBarcodeFromDataUrl(dataUrl){
  function tryNative(){
    if(!('BarcodeDetector' in window)) return Promise.reject(new Error('native-unsupported'));
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = function(){ reject(new Error('load-failed')); };
      img.src = dataUrl;
    }).then(function(img){
      var detector = new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','qr_code']});
      return detector.detect(img);
    }).then(function(results){
      if(!results || !results.length) throw new Error('not-found');
      return results[0].rawValue;
    });
  }
  function tryZxing(){
    if(!(window.ZXing && window.ZXing.BrowserMultiFormatReader)) return Promise.reject(new Error('Čtečka čárových kódů se nenačetla, zkontroluj připojení k internetu.'));
    var reader = new window.ZXing.BrowserMultiFormatReader();
    return reader.decodeFromImageUrl(dataUrl).then(function(result){ return result.getText(); });
  }
  return tryNative().catch(function(){ return tryZxing(); }).catch(function(){
    throw new Error('Čárový kód se na fotce nepodařilo rozpoznat. Zkus vyfotit kód zblízka, na ostro a rovně.');
  });
}
function parseQuantityString(str){
  if(!str) return null;
  var m = String(str).match(/([\d]+[.,]?[\d]*)\s*(ml|l|g|kg)\b/i);
  if(!m) return null;
  var val = parseFloat(m[1].replace(',', '.'));
  if(!isFinite(val) || val<=0) return null;
  var unit = m[2].toLowerCase();
  if(unit==='l'){ val*=1000; unit='ml'; }
  if(unit==='kg'){ val*=1000; unit='g'; }
  return {value: Math.round(val), unit: unit};
}
function extractAbvFromText(){
  var texts = Array.prototype.slice.call(arguments).filter(Boolean);
  for(var i=0;i<texts.length;i++){
    var m = String(texts[i]).match(/(\d{1,2}[.,]?\d?)\s*%\s*(?:vol|obj|alk|alc)/i);
    if(m){
      var v = parseFloat(m[1].replace(',', '.'));
      if(isFinite(v) && v>0 && v<80) return v;
    }
  }
  return 0;
}
function guessTypicalAbv(categoryTags, texts){
  var hay = ((categoryTags||[]).join(' ')+' '+texts.filter(Boolean).join(' ')).toLowerCase();
  if(/nealko|alcohol-free|bez\s*alkoholu|non-alcoholic|0\s*%/.test(hay)) return 0;
  var table = [
    [/absinth/, 55],
    [/tequila/, 38],
    [/whisk(e)?y/, 40],
    [/vodka/, 40],
    [/\brum\b/, 40],
    [/\bgin\b/, 40],
    [/slivovice|borovi[cč]ka|meruňkovice|hru[sš]kovice|destil[aá]t|brandy|koňak|cognac/, 40],
    [/lik[ée]r|liqueur/, 20],
    [/sekt|prosecco|champagne|šumivé\s*víno|sparkling\s*wine/, 11.5],
    [/medovina/, 12],
    [/\bv[ií]no\b|\bwine\b/, 12],
    [/cider|cidre/, 4.5],
    [/le[žz]ák|dvan[aá]ctka|\b12\s*°/, 5],
    [/des[ií]tka|\b10\s*°/, 4.2],
    [/\bpivo\b|\bbeer\b/, 4.5]
  ];
  for(var i=0;i<table.length;i++){
    if(table[i][0].test(hay)) return table[i][1];
  }
  return 0;
}
function lookupOpenFoodFacts(code){
  return fetch('https://world.openfoodfacts.org/api/v0/product/'+encodeURIComponent(code)+'.json')
    .then(function(res){ if(!res.ok) throw new Error('Chyba při vyhledávání produktu.'); return res.json(); })
    .then(function(data){
      if(!data || data.status!==1 || !data.product) throw new Error('Produkt s tímto kódem nebyl v databázi nalezen.');
      var p = data.product, n = p.nutriments||{};
      var kcal100 = n['energy-kcal_100g']!=null ? n['energy-kcal_100g'] : n['energy-kcal'];
      if(kcal100==null) throw new Error('Produkt nemá v databázi uvedené kalorie.');
      var qty = parseQuantityString(p.quantity) || parseQuantityString(p.serving_size);
      var alcohol100 = Number(n['alcohol_100g'])||0;
      var alcoholEstimated = false;
      if(!alcohol100){
        // OFF často nemá alcohol_100g vyplněné (crowdsourced data) — zkusíme dohledat % alkoholu v textu produktu
        alcohol100 = extractAbvFromText(p.product_name, p.generic_name, p.quantity, p.ingredients_text);
      }
      if(!alcohol100){
        // Poslední záchrana: typická hodnota ABV podle druhu nápoje (pivo/víno/destilát…)
        alcohol100 = guessTypicalAbv(p.categories_tags, [p.product_name, p.generic_name, p.categories]);
        if(alcohol100) alcoholEstimated = true;
      }
      return {
        name: p.product_name || p.generic_name || ('Produkt '+code),
        kcal100: Number(kcal100)||0,
        protein100: Number(n['proteins_100g'])||0,
        carbs100: Number(n['carbohydrates_100g'])||0,
        fat100: Number(n['fat_100g'])||0,
        alcohol100: alcohol100,
        alcoholEstimated: alcoholEstimated,
        defaultQty: qty ? qty.value : 100,
        defaultUnit: qty ? qty.unit : 'g'
      };
    });
}

function normalizeSearchText(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function getFoodHistorySuggestions(query){
  var nq = normalizeSearchText(query);
  if(!nq) return [];
  var seen = {};
  Object.keys(state.foodLog||{}).forEach(function(day){
    (state.foodLog[day]||[]).forEach(function(f){
      if(!f.name) return;
      var nname = normalizeSearchText(f.name);
      if(nname.indexOf(nq)===-1) return;
      var key = nname;
      if(!seen[key] || (f.time||'') > (seen[key].time||'')) seen[key] = f;
    });
  });
  var items = Object.keys(seen).map(function(k){ return seen[k]; });
  items.sort(function(a,b){ return (b.time||'').localeCompare(a.time||''); });
  return items.slice(0,5);
}
function searchOpenFoodFactsText(query){
  var url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(query)+'&search_simple=1&action=process&json=1&page_size=6&fields=product_name,generic_name,nutriments,quantity,categories_tags,categories';
  return fetch(url).then(function(res){ if(!res.ok) throw new Error('Vyhledávání se nezdařilo.'); return res.json(); }).then(function(data){
    var products = (data && data.products) || [];
    return products.map(function(p){
      var n = p.nutriments||{};
      var kcal100 = n['energy-kcal_100g']!=null ? n['energy-kcal_100g'] : n['energy-kcal'];
      if(kcal100==null || !(p.product_name||p.generic_name)) return null;
      var qty = parseQuantityString(p.quantity);
      var alcohol100 = Number(n['alcohol_100g'])||0;
      if(!alcohol100) alcohol100 = extractAbvFromText(p.product_name, p.generic_name, p.quantity);
      if(!alcohol100) alcohol100 = guessTypicalAbv(p.categories_tags, [p.product_name, p.generic_name, p.categories]);
      return {
        name: p.product_name || p.generic_name,
        kcal100: Number(kcal100)||0,
        protein100: Number(n['proteins_100g'])||0,
        carbs100: Number(n['carbohydrates_100g'])||0,
        fat100: Number(n['fat_100g'])||0,
        alcohol100: alcohol100,
        defaultQty: qty ? qty.value : 100,
        defaultUnit: qty ? qty.unit : 'g'
      };
    }).filter(Boolean).slice(0,5);
  });
}
function offInfoToDraft(info){
  var qty = info.defaultQty || 100;
  var factor = qty/100;
  var isMl = (info.defaultUnit === 'ml');
  var alcoholG = info.alcohol100 ? Math.round(qty * (info.alcohol100/100) * 0.79) : 0;
  return {
    name: info.name,
    kcal: Math.round(info.kcal100*factor),
    protein: Math.round(info.protein100*factor),
    carbs: Math.round(info.carbs100*factor),
    fat: Math.round(info.fat100*factor),
    alcohol: alcoholG,
    volumeMl: (alcoholG>0 && isMl) ? Math.round(qty) : null,
    abv: alcoholG>0 ? (Math.round(info.alcohol100*10)/10) : 0,
    alcoholEstimated: !!info.alcoholEstimated,
    quantity: qty, unit: info.defaultUnit || 'g'
  };
}

function calcBmi(w,h){ var m=h/100; return w/(m*m); }
function getCategoryKey(bmi){ if(bmi<18.5) return 'under'; if(bmi<25) return 'normal'; if(bmi<30) return 'over'; return 'obese'; }
function todayLocalISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function formatDateShort(iso){ var p=iso.split('-'); return p[2]+'.'+p[1]+'.'; }
function formatDateFull(iso){ var p=iso.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
function formatDateRelative(iso){
  var today = todayLocalISO();
  var y = new Date(); y.setDate(y.getDate()-1);
  var yesterday = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  if(iso===today) return 'Dnes';

function isoAddDays(iso, delta){
  var p = iso.split('-'); var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate()+delta);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

// Když se jídlo/pití přidává do jiného dne než dneška (přes šipky v navigaci dnů), časové razítko

function isoTimeHM(isoString){

  if(dayIso===todayLocalISO()) return now.toISOString();
  var p = dayIso.split('-');

// Pokud předchozí den přejedl plán, nabídne se otázka, jestli se má dnešní cíl o přebytek snížit.
// Dokud se uživatel nerozhodne, cíl zůstává normální (nesnížený) a zobrazí se otázka ano/ne.
function calcAdjustedTarget(plan, foodLog, dayIso){
  var prevIso = isoAddDays(dayIso, -1);
  var prevList = (foodLog && foodLog[prevIso]) || [];
  var prevKcal = foodTotals(prevList).kcal;
  var overage = Math.round(prevKcal - plan.target);
  if(overage <= 0){
    return {target:plan.target, adjustment:0, overage:0, pending:false};
  }
  var choice = state.calAdjustChoices ? state.calAdjustChoices[dayIso] : undefined;
  if(choice===true){
    var adjustedTarget = Math.max(plan.floor, plan.target - overage);
    var appliedAdjustment = plan.target - adjustedTarget;
    return {target:adjustedTarget, adjustment:appliedAdjustment, overage:overage, pending:false};
  }
  if(choice===false){
    return {target:plan.target, adjustment:0, overage:overage, pending:false, declined:true};
  }
  return {target:plan.target, adjustment:0, overage:overage, pending:true};
}
function kcalToKj(kcal){ return Math.round((Number(kcal)||0)*4.184); }
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// ---------- gauge ----------
var GAUGE_MIN=15, GAUGE_MAX=40, GAUGE_BOUNDS=[15,18.5,25,30,40];
var GAUGE_SEG_COLORS=[COLORS.under,COLORS.normal,COLORS.over,COLORS.obese];
function bmiToAngle(bmi){ var c=Math.max(GAUGE_MIN,Math.min(GAUGE_MAX,bmi)); var f=(c-GAUGE_MIN)/(GAUGE_MAX-GAUGE_MIN); return 180-f*180; }
function polarPoint(cx,cy,r,angleDeg){ var rad=angleDeg*Math.PI/180; return {x:cx+r*Math.cos(rad), y:cy-r*Math.sin(rad)}; }
function arcPath(cx,cy,r,a1,a2){ var s=polarPoint(cx,cy,r,a1), e=polarPoint(cx,cy,r,a2); var large=(a1-a2>180)?1:0; return 'M '+s.x+' '+s.y+' A '+r+' '+r+' 0 '+large+' 1 '+e.x+' '+e.y; }

function renderGauge(bmi){
  var cx=150,cy=150,r=112,tw=20;

    var a1=bmiToAngle(GAUGE_BOUNDS[i]), a2=bmiToAngle(GAUGE_BOUNDS[i+1]);
    segs += '<path d="'+arcPath(cx,cy,r,a1,a2)+'" stroke="'+GAUGE_SEG_COLORS[i]+'" stroke-width="'+tw+'" fill="none" opacity="0.9"/>';
  }
  var ticks='';
  GAUGE_BOUNDS.forEach(function(b){

  });
  return '<svg viewBox="0 0 300 172" class="gauge-svg" role="img" aria-label="BMI '+bmi.toFixed(1)+'">'+
    segs + ticks +
    '<g><line x1="'+cx+'" y1="'+cy+'" x2="'+tip.x+'" y2="'+tip.y+'" stroke="'+COLORS.ink+'" stroke-width="3" stroke-linecap="round"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="'+COLORS.ink+'"/><circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#fff"/></g></svg>';

// ---------- chart ----------
function renderChart(entries, minNormal, maxNormal){
  var data = sortedAsc(entries);
  if(data.length<2) return null;
  var W=600,H=260,padL=42,padR=14,padT=14,padB=28;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  var times = data.map(function(d){ return new Date(d.date).getTime(); });
  var minTs=Math.min.apply(null,times), maxTs=Math.max.apply(null,times);
  var weights = data.map(function(d){ return d.weight; });
  var yMin = Math.min.apply(null, weights.concat([minNormal])) - 2;
  var yMax = Math.max.apply(null, weights.concat([maxNormal])) + 2;
  function xScale(ts){ return padL + (maxTs===minTs?0.5:(ts-minTs)/(maxTs-minTs))*plotW; }
  function yScale(w){ return padT + (1-(w-yMin)/(yMax-yMin))*plotH; }

  var bandY1=yScale(maxNormal), bandY2=yScale(minNormal);
  var bandRect = '<rect x="'+padL+'" y="'+bandY1+'" width="'+plotW+'" height="'+(bandY2-bandY1)+'" fill="'+COLORS.accentSoft+'" opacity="0.7"/>';

  var gridY='';
  var ySteps=4;
  for(var i=0;i<=ySteps;i++){
    var val = yMin + (yMax-yMin)*i/ySteps;
    var y = yScale(val);
    gridY += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="'+COLORS.line+'" stroke-width="1"/>';
    gridY += '<text x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="'+COLORS.inkMuted+'" font-family="JetBrains Mono, monospace">'+val.toFixed(0)+'</text>';
  }

  var pts = data.map(function(d){ return xScale(new Date(d.date).getTime())+','+yScale(d.weight); });
  var polyline = '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+COLORS.accent+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';

  var dots = data.map(function(d){
    var x=xScale(new Date(d.date).getTime()), y=yScale(d.weight);
    return '<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+COLORS.accent+'"><title>'+formatDateFull(d.date)+': '+d.weight+' kg</title></circle>';
  }).join('');

  var xLabelStep = Math.max(1, Math.ceil(data.length/6));
  var xLabels='';
  data.forEach(function(d,i){
    if(i%xLabelStep===0 || i===data.length-1){
      var x=xScale(new Date(d.date).getTime());
      xLabels += '<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="'+COLORS.inkMuted+'" font-family="JetBrains Mono, monospace">'+formatDateShort(d.date)+'</text>';
    }
  });

  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;">'+
    bandRect + gridY + polyline + dots + xLabels + '</svg>';
}

function attachOnboardingEvents(){
  var sexSeg = document.getElementById('ob-sex-seg');
  sexSeg.querySelectorAll('.seg-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      sexSeg.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('ob-sex').value = btn.getAttribute('data-val');
    });
  });

  function wirePaceSeg(prefix){
    var seg = document.getElementById(prefix+'-pace-seg');
    if(!seg) return;
    seg.querySelectorAll('.seg-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        seg.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        var val = btn.getAttribute('data-val');
        document.getElementById(prefix+'-pace').value = val;
        var goalKey = document.getElementById(prefix+'-goal').value;
        var tipEl = document.getElementById(prefix+'-pace-tip');
        if(tipEl) tipEl.textContent = paceByKey(goalKey, val).tip;
      });
    });
  }
  wirePaceSeg('ob');

  document.getElementById('ob-goal').addEventListener('change', function(){
    var goalKey = this.value;
    document.getElementById('ob-pace-wrap').innerHTML = paceOptionsHtml(goalKey, 'normal', 'ob');
    wirePaceSeg('ob');
  });

  document.getElementById('onboard-form').addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('ob-name').value.trim();
    var age = Number(document.getElementById('ob-age').value);
    var height = Number(document.getElementById('ob-height').value);
    var weight = Number(document.getElementById('ob-weight').value);
    var sex = document.getElementById('ob-sex').value;
    var goal = document.getElementById('ob-goal').value;
    var activity = document.getElementById('ob-activity').value;
    var paceInput = document.getElementById('ob-pace');
    var pace = paceInput ? paceInput.value : 'normal';
    var targetWeightRaw = document.getElementById('ob-target-weight').value;
    var targetWeight = targetWeightRaw ? Number(targetWeightRaw) : null;
    var err = document.getElementById('ob-error');
    err.innerHTML='';
    var msg='';
    if(!name) msg='Zadej prosím jméno.';
    else if(!age || age<1 || age>120) msg='Zadej platný věk.';
    else if(!height || height<100 || height>250) msg='Zadej výšku v centimetrech (100–250).';
    else if(!weight || weight<20 || weight>300) msg='Zadej váhu v kilogramech (20–300).';
    else if(targetWeight!==null && (targetWeight<20 || targetWeight>300)) msg='Zadej reálnou cílovou váhu v kilogramech (20–300).';
    if(msg){ err.innerHTML='<div class="form-error">'+ICONS.alert+' '+msg+'</div>'; return; }
    saveProfile({name:name, age:age, height:height, sex:sex, goal:goal, activity:activity, pace:pace, targetWeight:targetWeight});
    saveEntries([{id:uid(), date:todayLocalISO(), weight:weight}]);
    render();
  });
}

    '<div class="bmi-teaser-icon" style="background:'+cat.soft+';color:'+cat.color+'">'+bmi.toFixed(1)+'</div>'+
    '<div class="exercise-teaser-text"><div class="card-title" style="margin-bottom:2px">Tvoje BMI</div>'+
      '<p><span class="pill-dot" style="background:'+cat.color+';display:inline-block;margin-right:5px;"></span>'+cat.label+'</p></div>'+
    '<button class="btn-secondary" id="open-bmi-btn">Zobrazit</button>'+
  '</section>';

  html += '<section class="card cal-hero fade-up">'+
    '<div class="eyebrow" style="margin-bottom:4px">Tvůj denní kalorický plán</div>'+
    '<div class="goal-pill" style="background:'+plan.goal.soft+';color:'+plan.goal.color+'"><span class="pill-dot" style="background:'+plan.goal.color+'"></span>'+plan.goal.label+'</div>'+
    '<div><span class="cal-hero-num">'+plan.target.toLocaleString('cs-CZ')+'</span></div>'+
    '<div class="cal-hero-unit">KCAL / DEN · '+kcalToKj(plan.target).toLocaleString('cs-CZ')+' KJ / DEN</div>'+
    (plan.belowFloor ? '<div class="cal-warning">'+ICONS.alert+'<span>Vypočtený deficit by šel pod bezpečnou hranici, příjem je proto nastaven na minimum '+plan.floor+' kcal. Větší deficit doporučujeme řešit s odborníkem.</span></div>' : '')+
    '<div class="cal-sub-grid">'+
      '<div class="cal-sub-card"><div class="cal-sub-label">Bazální metabolismus</div><div class="cal-sub-value">'+plan.bmr+' kcal</div><div class="food-item-kj">'+kcalToKj(plan.bmr)+' kJ</div></div>'+
      '<div class="cal-sub-card"><div class="cal-sub-label">Výdej s aktivitou</div><div class="cal-sub-value">'+plan.tdee+' kcal</div><div class="food-item-kj">'+kcalToKj(plan.tdee)+' kJ</div></div>'+
    '</div>'+
    '<div class="macro-grid">'+
      '<div class="macro-card">'+macroRing(plan.proteinPct, plan.proteinG, 'g bílkovin', COLORS.under)+'<div class="macro-name">Bílkoviny</div></div>'+
      '<div class="macro-card">'+macroRing(plan.carbPct, plan.carbG, 'g sacharidů', COLORS.accent)+'<div class="macro-name">Sacharidy</div></div>'+
      '<div class="macro-card">'+macroRing(plan.fatPct, plan.fatG, 'g tuků', COLORS.over)+'<div class="macro-name">Tuky</div></div>'+
    '</div>'+
    '<p class="cal-note">'+plan.pace.tip+(plan.weeklyDeltaKg!==0 && !plan.belowFloor ? ' Odhad: <strong>'+(plan.weeklyDeltaKg>0?'+':'')+plan.weeklyDeltaKg+' kg/týden</strong>.' : '')+' Výpočet vychází z aktuální váhy ('+latest.weight+' kg), výšky, věku a zvolené aktivity — jde o odhad, ne lékařské doporučení.</p>'+
    '<div style="margin-top:14px"><button class="btn-secondary" id="open-goal-btn">'+ICONS.pencil+' Upravit cíl a aktivitu</button></div>'+
  '</section>';

  var goalProgress = calcWeightGoalProgress(profile, first.weight, latest.weight, plan);
  if(goalProgress){
    var gp = goalProgress;
    var gpBarColor = plan.goal.color;
    var gpStatusHtml;
    if(gp.reached){
      gpStatusHtml = '<div class="cal-note" style="margin-top:12px"><strong style="color:'+COLORS.normal+'">Cílové váhy jsi dosáhl(a)! 🎉</strong> Teď je čas ji udržet.</div>';
    } else if(gp.directionMismatch){
      gpStatusHtml = '<div class="cal-warning">'+ICONS.alert+'<span>Cílová váha neodpovídá zvolenému cíli a tempu — zkontroluj nastavení v „Upravit cíl a aktivitu".</span></div>';
    } else {
      gpStatusHtml = '<div class="cal-note" style="margin-top:12px">Zbývá <strong>'+Math.abs(gp.diffToGo).toFixed(1)+' kg</strong>'+(gp.weeksLeft?' · odhad <strong>~'+gp.weeksLeft+' '+(gp.weeksLeft===1?'týden':(gp.weeksLeft<5?'týdny':'týdnů'))+'</strong> při aktuálním tempu.':'.')+'</div>';
    }
    html += '<section class="card fade-up">'+
      '<div class="card-title" style="margin-bottom:14px">Cíl váhy</div>'+
      '<div class="goal-progress-row">'+
        '<div><div class="cal-sub-label">Teď</div><div class="cal-sub-value">'+latest.weight+' kg</div></div>'+
        '<div style="text-align:right"><div class="cal-sub-label">Cíl</div><div class="cal-sub-value">'+gp.targetWeight+' kg</div></div>'+
      '</div>'+
      '<div class="goal-progress-track"><div class="goal-progress-fill" style="width:'+gp.pct+'%;background:'+gpBarColor+'"></div></div>'+
      gpStatusHtml+
    '</section>';
  }

html += '<section class="stat-grid fade-up">'+
    '<div class="stat-card"><div class="stat-label">Aktuální váha</div><div class="stat-value">'+latest.weight+' <span>kg</span></div><div class="stat-sub">'+formatDateFull(latest.date)+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">Změna od začátku</div><div class="stat-value" style="color:'+deltaColor+'">'+deltaIcon+' '+Math.abs(delta)+' <span>kg</span></div><div class="stat-sub">od '+formatDateFull(first.date)+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">Počet záznamů</div><div class="stat-value">'+entries.length+'</div><div class="stat-sub">celkem</div></div>'+
  '</section>';

  html += '<section class="card exercise-teaser fade-up">'+
    '<div class="exercise-teaser-icon">'+ICONS.dumbbell+'</div>'+
    '<div class="exercise-teaser-text"><div class="card-title">Tipy na cvičení</div><p>Cviky na horní i dolní partie, doma bez posilovny.</p></div>'+
    '<button class="btn-secondary" id="open-exercise-btn">Zobrazit</button>'+
  '</section>';

  html += '<section class="card fade-up"><div class="card-title">Zapsat váhu</div>'+
    '<form class="entry-form" id="entry-form">'+
      '<label class="field"><span>Datum</span><input class="input" id="entry-date" type="date" value="'+todayLocalISO()+'" max="'+todayLocalISO()+'"></label>'+
      '<label class="field"><span>Váha (kg)</span><input class="input" id="entry-weight" type="number" inputmode="decimal" step="0.1" placeholder="např. 78.5"></label>'+
      '<button class="btn-primary" type="submit">'+ICONS.plus+' Přidat</button>'+
    '</form><div id="entry-error"></div>'+
  '</section>';

  html += '<section class="card fade-up"><div class="card-title">Progres v čase</div>';
  if(chartSvg){
    html += '<div class="chart-wrap">'+chartSvg+'<div class="chart-legend"><span class="legend-swatch"></span> doporučené pásmo hmotnosti</div></div>';
  } else {
    html += '<div class="empty-state">Přidej ještě aspoň jeden záznam a uvidíš graf progresu.</div>';
  }
  html += '</section>';

  html += '<section class="card fade-up"><div class="card-title">Historie záznamů</div><div class="history-list">';
  asc.forEach(function(entry){
    html += '<div class="history-item"><div><div class="history-weight">'+entry.weight+' kg</div><div class="history-date">'+formatDateFull(entry.date)+'</div></div>'+
      '<button class="btn-icon subtle" data-delete-id="'+entry.id+'" aria-label="Smazat záznam">'+ICONS.trash+'</button></div>';
  });
  html += '</div></section>';

  html += '<footer class="footer-note">Údaje se ukládají pouze v tomto prohlížeči. Výpočty a doporučení jsou obecná a nenahrazují konzultaci s lékařem.</footer>';
  html += '</div>';

  if(state.editingProfile){
    html += renderEditModal(profile);
  }
  if(state.showExerciseModal){
    html += renderExerciseModal();
  }
  if(state.showBmiModal){
    html += renderBmiModal(bmi, cat, profile, minNormal, maxNormal);
  }
  if(state.showAlcoholModal){
    html += renderAlcoholModal(alc);
  }
  if(state.showAddFoodModal){
    html += renderAddFoodModal();
  }
  if(state.showAiSettingsModal){
    html += renderAiSettingsModal();
  }
  if(state.showFoodHistoryModal){
    html += renderFoodHistoryModal();
  }
  return html;
}

function renderExerciseCard(ex, tab, idx){
  var badge = ex.eq==='bodyweight' ?
      '<span class="eq-badge bodyweight">'+ICONS.body+' vlastní váha</span>' :
    ex.eq==='dumbbell' ?
      '<span class="eq-badge dumbbell">'+ICONS.dumbbell+' činky</span>' :
      '<span class="eq-badge bodyweight">'+ICONS.body+' váha</span><span class="eq-badge dumbbell">'+ICONS.dumbbell+' i činky</span>';
  return '<div class="exercise-item" data-tab="'+tab+'" data-idx="'+idx+'" role="button" tabindex="0">'+
    '<div class="exercise-head"><div class="exercise-name">'+esc(ex.name)+'</div><div class="exercise-badges">'+badge+'</div></div>'+
    '<div class="exercise-meta">'+esc(ex.group)+' · '+esc(ex.sets)+'</div>'+
    '<p class="exercise-tip">'+esc(ex.tip)+'</p>'+
    '<div class="exercise-open-hint">Zobrazit postup a animaci '+ICONS.chevronDown.replace('width="15" height="15"','width="12" height="12" style="transform:rotate(-90deg)"')+'</div>'+
  '</div>';
}

function renderLookupButtons(){
  var ktLoading = state.foodLookupLoading === 'kalorickeTabulky';
  var ndLoading = state.foodLookupLoading === 'nutriDatabaze';
  var html = '<div class="field-row" style="margin-top:8px">'+
    '<button type="button" class="btn-secondary" id="food-lookup-kt-btn" style="flex:1;justify-content:center;font-size:12px;padding:9px 6px"'+(state.foodLookupLoading?' disabled':'')+'>'+
      (ktLoading ? '<span class="ai-spinner"></span>Hledám...' : '📊 Kalorické tabulky')+
    '</button>'+
    '<button type="button" class="btn-secondary" id="food-lookup-nd-btn" style="flex:1;justify-content:center;font-size:12px;padding:9px 6px"'+(state.foodLookupLoading?' disabled':'')+'>'+
      (ndLoading ? '<span class="ai-spinner"></span>Hledám...' : '🧪 NutriDatabáze')+
    '</button>'+
  '</div>';
  if(state.foodLookupNote){
    html += '<div style="font-size:11.5px;color:var(--accent,#6fd39a);margin:6px 0 0">'+ICONS.check+' '+esc(state.foodLookupNote)+'</div>';

function renderAddFoodModal(){
  var d = state.foodDraft || {};
  var isEditing = !!state.editingFoodId;
  var mode = isEditing ? 'text' : (state.foodInputMode || 'text');
  var targetDay = (isEditing ? state.editingFoodDay : state.selectedFoodDate) || todayLocalISO();
  var titleSuffix = targetDay===todayLocalISO() ? '' : ' · '+formatDateRelative(targetDay);
  var loading = state.foodAiLoading;

  var mealSel = state.addFoodMealType || guessMealType();
  var mealSeg = '<label class="field" style="margin-bottom:12px"><span>Kdy jsi jedl/a?</span>'+
    '<div class="seg meal-seg" id="meal-type-seg">'+
      MEAL_TYPES.map(function(m){
        return '<button type="button" class="seg-btn'+(mealSel===m.key?' active':'')+'" data-meal="'+m.key+'">'+m.icon+' '+m.label+'</button>';
      }).join('')+
    '</div></label>';

  var timeVal = isoTimeHM(d.time);

  var modeTabs = isEditing ? '' : '<div class="seg" id="food-mode-seg" style="margin-bottom:14px">'+
    '<button type="button" class="seg-btn'+(mode==='text'?' active':'')+'" data-mode="text">Popis</button>'+
    '<button type="button" class="seg-btn'+(mode==='photo'?' active':'')+'" data-mode="photo">'+ICONS.camera+' Foto</button>'+
    '<button type="button" class="seg-btn'+(mode==='barcode'?' active':'')+'" data-mode="barcode">'+ICONS.barcode+' Kód</button>'+
    '<button type="button" class="seg-btn'+(mode==='alcohol'?' active':'')+'" data-mode="alcohol">🍷 Alkohol</button>'+
  '</div>';

  var qtyUnitFields =
    '<div class="field-row">'+
      '<label class="field" style="flex:0 0 90px"><span>Množství</span><input class="input" id="food-qty" type="number" inputmode="decimal" step="0.1" min="0.1" value="'+(d.quantity!=null?d.quantity:(mode==='barcode'?100:1))+'"></label>'+
      '<label class="field"><span>Jednotka</span><select class="input" id="food-unit">'+
        UNITS.map(function(u){ return '<option value="'+u.key+'"'+((d.unit||(mode==='barcode'?'g':'porce'))===u.key?' selected':'')+'>'+u.label+'</option>'; }).join('')+
      '</select></label>'+
      '<label class="field" style="flex:0 0 100px"><span>Čas</span><input class="input" id="food-time" type="time" value="'+timeVal+'"></label>'+
    '</div>';

  var prepState = d.prepState || 'cooked';
  var prepSeg = '<label class="field" style="margin-bottom:12px"><span>Stav jídla (pro AI odhad)</span>'+
    '<div class="seg" id="food-prep-seg">'+
      '<button type="button" class="seg-btn'+(prepState==='cooked'?' active':'')+'" data-prep="cooked">Hotové / vařené</button>'+
      '<button type="button" class="seg-btn'+(prepState==='raw'?' active':'')+'" data-prep="raw">Syrové</button>'+
    '</div></label>';

  var modeBody = '';
  if(isEditing){
    modeBody = qtyUnitFields + prepSeg;
  } else if(mode==='text'){
    modeBody =
      '<div class="field-desc-wrap"><label class="field"><span>Co jsi (s)nědl/a?</span><input class="input" id="food-desc" autocomplete="off" placeholder="např. kuřecí prsa s rýží" value="'+esc(d.description||'')+'"></label>'+
        '<div id="food-desc-suggestions" class="desc-suggestions" style="display:none"></div>'+
      '</div>'+
      qtyUnitFields+
      prepSeg+
      '<button type="button" class="btn-secondary" id="food-ai-btn" style="width:100%;justify-content:center"'+(loading?' disabled':'')+'>'+
        (loading ? '<span class="ai-spinner"></span>Počítám kalorie...' : ICONS.sparkle+' Spočítat pomocí AI')+
      '</button>'+
      renderLookupButtons()+
      (state.foodAiError ? '<div class="form-error" style="margin-top:8px">'+ICONS.alert+' '+esc(state.foodAiError)+'</div>' : '');
  } else if(mode==='photo'){
    modeBody =
      '<input type="file" accept="image/*" capture="environment" id="food-photo-input" style="display:none">'+
      '<button type="button" class="btn-secondary" id="food-photo-trigger" style="width:100%;justify-content:center">'+ICONS.camera+' '+(state.foodPhoto?'Vyfotit znovu':'Vyfotit jídlo')+'</button>'+
      (state.foodPhoto ? '<img src="'+state.foodPhoto+'" style="width:100%;border-radius:14px;margin-top:10px;max-height:220px;object-fit:cover;display:block">' : '')+
      qtyUnitFields+
      (state.foodPhoto ? '<button type="button" class="btn-secondary" id="food-photo-ai-btn" style="width:100%;justify-content:center"'+(loading?' disabled':'')+'>'+
        (loading ? '<span class="ai-spinner"></span>Analyzuji fotku...' : ICONS.sparkle+' Spočítat z fotky') +
      '</button>' : '')+
      (state.foodAiError ? '<div class="form-error" style="margin-top:8px">'+ICONS.alert+' '+esc(state.foodAiError)+'</div>' : '');
  } else if(mode==='barcode'){
    modeBody =
      '<input type="file" accept="image/*" capture="environment" id="barcode-photo-input" style="display:none">'+
      '<button type="button" class="btn-secondary" id="barcode-photo-trigger" style="width:100%;justify-content:center">'+ICONS.barcode+' '+(state.barcodePhoto?'Vyfotit znovu':'Vyfotit čárový kód')+'</button>'+
      (state.barcodePhoto ? '<img src="'+state.barcodePhoto+'" style="width:100%;border-radius:14px;margin-top:10px;max-height:180px;object-fit:cover;display:block">' : '')+
      qtyUnitFields+
      '<div style="font-size:11.5px;color:var(--ink-muted);margin:-6px 0 12px">Po vyfocení se kód zkusí najít automaticky a množství i kalorie se předvyplní podle balení produktu — klidně uprav.</div>'+
      (state.barcodePhoto ? '<button type="button" class="btn-secondary" id="barcode-scan-btn" style="width:100%;justify-content:center"'+(loading?' disabled':'')+'>'+
        (loading ? '<span class="ai-spinner"></span>Hledám produkt...' : ICONS.sparkle+' Najít kalorie podle kódu') +
      '</button>' : '')+
      (state.foodAiError ? '<div class="form-error" style="margin-top:8px">'+ICONS.alert+' '+esc(state.foodAiError)+'</div>' : '');
  } else if(mode==='alcohol'){

    var common = ALCOHOL_PRESETS.filter(function(p){ return p.common; });
    modeBody =
      '<div class="field-desc-wrap"><label class="field"><span>Hledej nápoj</span><input class="input" id="alcohol-search" autocomplete="off" placeholder="např. pivo, víno, vodka, fernet, slivovice…" value="'+esc(aq)+'"></label>'+
        '<div id="alcohol-search-suggestions" class="desc-suggestions" style="display:none"></div>'+
      '</div>'+
      (state.alcoholAddedName ? '<div class="alc-added-toast">'+ICONS.check+' Přidáno: '+esc(state.alcoholAddedName)+'</div>' : '')+
      qtyUnitFields+
      '<div class="food-mini-label" style="margin:4px 0 8px">Nejčastější</div>'+
      '<div class="alc-preset-grid">'+
        common.map(function(p){
          var idx = ALCOHOL_PRESETS.indexOf(p);
          return '<div class="alc-preset-card">'+
            '<div class="alc-preset-name">'+esc(p.name)+'</div>'+
            '<div class="alc-preset-meta">'+p.volumeMl+' ml · '+p.abv+' % · '+p.kcal+' kcal</div>'+
            '<button type="button" class="alc-preset-add" data-alc-quick-idx="'+idx+'">+ Přidat</button>'+
          '</div>';
        }).join('')+
      '</div>'+
      '<div style="font-size:11.5px;color:var(--ink-muted);margin:12px 0 0">Klepnutím na "+ Přidat" se nápoj rovnou uloží do dnešního dne s typickou porcí. Ťuknutím na výsledek hledání ho místo toho jen předvyplníš níže a můžeš upravit množství.</div>';
  }

  return '<div class="modal-overlay" id="food-modal-overlay">'+
    '<div class="modal" id="food-modal-box">'+
      '<div class="modal-header"><div class="card-title" style="margin:0">'+(isEditing?'Upravit jídlo':'Přidat jídlo'+titleSuffix)+'</div><button class="btn-icon subtle" id="food-modal-close-btn" aria-label="Zavřít">'+ICONS.x+'</button></div>'+
      mealSeg+
      modeTabs+
      modeBody+
      '<div class="ai-result-card">'+
        '<div class="ai-result-title">Údaje k uložení (dej se upravit ručně)</div>'+
        (d.knownFoodMatch ? '<div style="font-size:11.5px;color:var(--accent,#6fd39a);margin:-4px 0 10px">'+ICONS.check+' Použity hodnoty, které máš pro tuto položku už dřív potvrzené — zůstanou stejné bez ohledu na to, jak jídlo přidáváš.</div>' : '')+
        '<label class="field"><span>Název jídla</span><input class="input" id="food-name" value="'+esc(d.name||'')+'"></label>'+
        (isEditing ? '<button type="button" class="btn-secondary" id="food-ai-name-btn" style="width:100%;justify-content:center;margin:-6px 0 12px"'+(loading?' disabled':'')+'>'+
          (loading ? '<span class="ai-spinner"></span>Počítám kalorie...' : ICONS.sparkle+' Spočítat pomocí AI')+
        '</button>'+
        renderLookupButtons()+
        (state.foodAiError ? '<div class="form-error" style="margin:-6px 0 10px">'+ICONS.alert+' '+esc(state.foodAiError)+'</div>' : '') : '')+

        '<label class="field"><span>Kalorie (kcal)</span><input class="input" id="food-kcal" type="number" inputmode="decimal" value="'+(d.kcal!=null?d.kcal:'')+'"><span id="food-kcal-kj" style="font-size:11px;color:var(--ink-muted);font-weight:500">'+(d.kcal!=null?kcalToKj(d.kcal)+' kJ':'')+'</span></label>'+
        '<div class="field-3">'+
          '<label class="field"><span>Bílkoviny (g)</span><input class="input" id="food-protein" type="number" inputmode="decimal" value="'+(d.protein!=null?d.protein:'')+'"></label>'+
          '<label class="field"><span>Sacharidy (g)</span><input class="input" id="food-carbs" type="number" inputmode="decimal" value="'+(d.carbs!=null?d.carbs:'')+'"></label>'+
          '<label class="field"><span>Tuky (g)</span><input class="input" id="food-fat" type="number" inputmode="decimal" value="'+(d.fat!=null?d.fat:'')+'"></label>'+
        '</div>'+
        '<label class="field"><span>Alkohol — čistý líh (g)</span><input class="input" id="food-alcohol" type="number" inputmode="decimal" min="0" value="'+(d.alcohol!=null?d.alcohol:0)+'"></label>'+
        (d.alcohol ? '<div style="font-size:11.5px;color:var(--ink-muted);margin:-6px 0 4px" id="food-alcohol-detail">'+
          (d.volumeMl ? d.volumeMl+' ml' : '')+(d.volumeMl && d.abv ? ' · ' : '')+(d.abv ? d.abv+' % obj.' : '')+
          (d.alcoholEstimated ? ' (typický odhad podle druhu nápoje, uprav pokud znáš přesné % na etiketě)' : '')+
        '</div>' : '')+
        '<input type="hidden" id="food-alcohol-volume" value="'+(d.volumeMl!=null?d.volumeMl:'')+'">'+
        '<input type="hidden" id="food-alcohol-abv" value="'+(d.abv!=null?d.abv:'')+'">'+
      '</div>'+
      '<div id="food-error"></div>'+
      '<button class="btn-primary" id="food-save-btn" type="button" style="width:100%;margin-top:12px">'+ICONS.check+' '+(isEditing?'Uložit změny':'Uložit jídlo')+'</button>'+
    '</div>'+
  '</div>';
}

function renderAiSettingsModal(){
  var k = state.aiKeys||{};
  return '<div class="modal-overlay" id="ai-settings-overlay">'+

function renderFoodHistoryModal(){
  var log = state.foodLog||{};
  var days = Object.keys(log).filter(function(d){ return Array.isArray(log[d]) && log[d].length>0; }).sort().reverse();
  var body;
  if(!days.length){
    body = '<div class="food-empty">Zatím tu nemáš žádnou historii jídel.</div>';
  } else {
    body = days.map(function(day){
      var list = log[day];
      var t = foodTotals(list);
      return '<div class="fh-day">'+
        '<div class="fh-day-head"><div class="fh-day-date">'+formatDateRelative(day)+'</div><div class="fh-day-total">'+Math.round(t.kcal)+' kcal · '+kcalToKj(t.kcal)+' kJ celkem</div></div>'+
        '<div class="meal-groups" style="margin-top:0">'+renderMealGroupedList(list, day, {showAdd:false})+'</div>'+
      '</div>';
    }).join('');
  }
  return '<div class="modal-overlay fh-modal" id="food-history-overlay">'+
    '<div class="modal" id="food-history-box">'+
      '<div class="modal-header"><div class="card-title" style="margin:0">Historie jídel</div><button class="btn-icon subtle" id="food-history-close-btn" aria-label="Zavřít">'+ICONS.x+'</button></div>'+
      body+
    '</div>'+
  '</div>';
}

    state.showAddFoodModal=true; state.foodDraft={}; state.foodAiError=''; state.foodAiLoading=false; state.foodLookupError=''; state.foodLookupNote=''; state.foodLookupLoading=null;
    state.foodInputMode='text'; state.foodPhoto=null; state.barcodePhoto=null;

    state.editingFoodId=null; state.editingFoodDay=null;
    render();
  });

  document.querySelectorAll('[data-meal-add]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var mt = btn.getAttribute('data-meal-add');
      state.addFoodMealType = mt;
      state.showAddFoodModal=true; state.foodDraft={}; state.foodAiError=''; state.foodAiLoading=false; state.foodLookupError=''; state.foodLookupNote=''; state.foodLookupLoading=null;
      state.foodInputMode='text'; state.foodPhoto=null; state.barcodePhoto=null;
      state.alcoholSearchQuery=''; state.alcoholAddedName='';
      state.editingFoodId=null; state.editingFoodDay=null;
      render();
    });
  });

  document.querySelectorAll('[data-edit-food-id]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-edit-food-id');
      var day = btn.getAttribute('data-edit-food-day');
      var entry = (state.foodLog[day]||[]).filter(function(f){ return f.id===id; })[0];
      if(!entry) return;
      state.editingFoodId = id;
      state.editingFoodDay = day;
      state.foodDraft = Object.assign({}, entry);
      state.addFoodMealType = entry.mealType || guessMealType();
      state.foodInputMode = 'text';
      state.foodPhoto = null; state.barcodePhoto = null;
      state.foodAiError=''; state.foodAiLoading=false; state.foodLookupError=''; state.foodLookupNote=''; state.foodLookupLoading=null;
      state.showAddFoodModal = true;
      render();
    });
